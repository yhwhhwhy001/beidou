# 北斗 V5 — CI
#
# 这个文件在 2026-09-09 至 2026-09-13 之间教了一件事，写在这里免得下次重学：
#
#   连续 23 次推送 failure、4 天，每次 35–45s。这个时长说明它挂在 `mypy` 那一步，
#   `pytest` 那一步**一次都没跑过**。同期本地 `pytest -m "not network"` 是全绿的，
#   所以这 4 天里 CI 并没有藏住一个真实的测试失败——它藏住的是**"改动被机械检查过"这件事本身**。
#   这个仓库的整条治理线（预登记 → 证据 → registry 启动门）都建立在这上面。
#
# 由此，这个文件有两条不能再退的性质：
#
#   1. 依赖按 `requirements.lock` 安装，不每次重新解析。
#      事故的根因是 `pyproject.toml` 写 `mypy>=1.10`，CI 每次解析到当天最新，解析到了 mypy 2.x，
#      收窄规则变严（`all(isinstance(...) for ...)` 不再收窄），30 个错误一次冒出来。
#      同一个缺口下一次会以别的形式再来（`pandas>=2.2` 现在解析到 3.0.x，语义已经变过）。
#      版本的改变从此必须是一次显式提交。锚的时间边界与适用范围见 `requirements.lock` 的头注。
#
#   2. 四道门（Format / Lint / Types / Tests）**互不遮挡**：每一步都带
#      `if: !cancelled() && install 成功`，所以一次运行能同时告诉你这四件事各自的状态，
#      而不是"第一个红的挡住后面全部"。
#      注意这**不是把门变松**：GitHub Actions 里一个失败的步骤照样让整个 job failure
#      （`continue-on-error` 才是变松，这里没有用）。只是不让它失明。
#      唯一的例外是 Install 失败——那时后面四步没有可跑的环境，跳过比跑出四条无意义的红更清楚。

name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Python 版本上界不要动：`pyproject` 的 `requires-python` 是 `>=3.12,<3.14`，
      # 这个仓库有过"3.14 静默掩盖了本该暴露的真实失败"的教训。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install（按锁安装，不重新解析）
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      # 让这次运行能自我说明它是在什么上面跑出来的——与 registry 指纹、
      # construction_fingerprint 同一条理由。日志里留一份，日后对不上时有据可查。
      - name: Environment（版本存档）
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python -VV
          python -c "import numpy, pandas, pyarrow; print('numpy', numpy.__version__, '| pandas', pandas.__version__, '| pyarrow', pyarrow.__version__)"
          ruff --version
          mypy --version
          pytest --version

      # ↓ 以下四步顺序保持 Format → Lint → Types → Tests（读日志的习惯顺序），
      #   但靠 `if` 让它们各自独立成败，任何一步红都不会让后面的步骤不跑。
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff format --check .

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff check .

      - name: Types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy

      # 不要给这一步加 `--cov`：那会改变所有人（包括本地和其它并行工作）跑测试时的行为。
      # 覆盖率是按需跑的，命令写在 `pyproject.toml` 的 dev extras 注释里。
      - name: Tests (offline)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pytest -m "not network"
