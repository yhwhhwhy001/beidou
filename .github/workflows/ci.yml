name: 北斗 CI — Lint, Typecheck, Test, Security

on:
  push:
    branches: [main, "refactor/**", "fix/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check beidou_* apps tests

      - name: Type check (mypy)
        run: mypy beidou_shared beidou_safety beidou_strategy beidou_research beidou_policy beidou_security beidou_observability beidou_exchange beidou_lifecycle beidou_delivery beidou_autonomy beidou_infra beidou_data beidou_control beidou_chaos beidou_production beidou_reporting beidou_certification beidou_core --no-error-summary

      - name: Unit tests
        run: pytest tests/unit -q

      - name: Integration tests
        run: pytest tests/integration -q

      - name: Architecture tests
        run: pytest tests/architecture -q

      - name: Test quality scan
        run: python scripts/scan_test_quality.py tests/

      - name: Hardcoded value scan
        run: python scripts/scan_hardcoded.py beidou_* apps

      - name: Coverage report
        run: pytest tests/ -q --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install bandit pip-audit
      - name: Security scan (bandit)
        run: bandit -r beidou_* -c pyproject.toml
      - name: Dependency audit
        run: pip-audit
