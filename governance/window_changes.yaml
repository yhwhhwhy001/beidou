# 在批次窗口里才能应用的构造变更，和它们各自在等什么。
#
# §8 的 Phase 4a 写的是「块 4 必改项**一次改完** → 重启 → 攒 30 天干净窗口」——这句话预设了一份
# 清单：一批构造变更在一个窗口里一起落。那份清单从来不存在。每条变更都在某篇日志里被裁定，
# 而日志没有读者，于是窗口打开的那天，没有任何东西告诉谁它本该带上什么。
#
# 这与 `reopen.yaml` 是同一个形状的两个方向：那边是「被判负的假设没人重开」，这边是
# 「被裁定的变更没人应用」。
#
# 机器在这里只能回答一件事：日期到了没有。其余（这条变更今天还对不对、测量有没有过期、
# 这个窗口值不值得花在它身上）都是裁量，条目里逐条写明。
#
# `beidou governance window` 是它的读者。它**不应用任何东西**——应用是一次 `governance apply` 事务。

entries:
  - id: probe-stop-caliber
    subject: 探针停损的口径与阈值（flow_short 与 main）
    queued: 2026-09-12
    earliest_window: 2026-10-03
    change: >-
      `probe_status` 的闸从「已实现归因收入」改读「盯市」口径（`marked_pnl`，已实现并已在日报并排打印），
      同时把 `config/alpha_registry.yaml` 的 `probe.stop.max_loss` 改为该口径下的经验 2.28% 分位数：
      flow_short 2.0% → **7.5%**，main 6.0% → **11.2%**。两者必须一起改。
      **2026-09-30 更正：上面两个数是 k = 0.30 时量的，已经过期。** 同一条规则在今天的构造（k = 0.175）上给出
      flow_short **4.5%**、main **7.5%**。照旧数应用，flow 的 −7.5% 在 48,361 个 30 天窗口里一次都碰不到，
      又回到这条变更要修的「打不响」。应用时用 `measured_at` 记下的那套配置上量出的数；vol_target 或 fraction
      变了先重量（`scratchpad/probe_stop_tails.py`，零 ledger），再改这里的数与 `measured_at`。测试钉住两边一致。
    measured: >-
      在被验证过的面板（2021-01-31 → 2026-09-07，49,080 bar × 241 币）上重建每本书自己的权重路径，
      取 w_{t-1}·r_t 的 30 天滚动和：flow_short 年化 σ 9.70% / 30 天 σ 3.239% / 2.28% 分位数 −7.51%；
      main 29.69% / 7.233% / −11.22%。现行阈值分别位于 0.62σ 与 0.83σ；而在循环现在读的那个
      已实现口径上，flow 的 −2% 位于 **14.6σ**——打不响。
      **2026-09-30 重量**（同一方法、同一段面板，今天的 profile 与 registry，k = 0.175；面板 878 币；
      `scratchpad/probe_stop_tails.py`，读数全文在 RESEARCH_LOG 同日一节）：flow_short 年化 σ 5.59% / 30 天 σ 1.887% / 2.28% 分位数
      −4.51%；main 17.58% / 4.473% / −7.54%。30 天窗口落到阈值以下的比例：flow 现行 2.0% 13.3%、规则值 4.5%
      2.31%、旧数 7.5% 0.000%；main 现行 6.0% 5.80%、规则值 7.5% 2.36%、旧数 11.2% 0.196%。
    # What the thresholds above were measured on: the profile's vol target and the registry's flow fraction.
    # They are shares of equity and the book's P&L scales with both, so they belong to these values and no others.
    # `tests/governance/test_the_batch_window_has_a_list.py` goes red when the profile or the registry moves
    # away from it while this entry is still queued: re-measure, then update the numbers and this block.
    measured_at:
      vol_target: 0.175
      flow_short_fraction: 0.333333
      commit: ec2d97a7
    why_it_waits: >-
      `max_loss` 在 `construction_fingerprint` 里（`engine.py` 的 `stop_of`），所以改它是一次构造变更，
      而 §1 把「窗口外改构造」列为 Out、K-EX14 就是为这件事写的。并且口径与阈值必须一起动：
      只换口径而留着 2%，flow 的盯市读数 −3.197% 当场就会触发停损、把书关掉（falsifier F3 量到的）。
      **2026-09-30 更正：第一句的前提不成立。** `stop_of` 在 `registry_digest` 里，不在 `construction_fingerprint`
      里，09-12 的 `3e584cbf` 上就是这样（`registry_digest` 从第 1631 行起，`stop_of` 在 1657 行，
      `construction_fingerprint` 从 1717 行起）。改 `max_loss` 改的是 registry 摘要，不是构造。K-EX14 管 exit overlay
      与信号参数，这条两样都不是。「口径与阈值必须一起动」仍然成立。发现者是同日 Backtest guard 会话（#275）。
    cost: >-
      清零 M-010 的 30 天窗口（应用当日归零，最早读数顺延约 8 天）并重启 M-G06 的 18 个月。
      这是任何一次构造变更都要付的同一笔钱，所以它应当与该窗口的其他构造变更**一起**付。
      **2026-09-30 更正价钱**（前提见 `why_it_waits` 的更正）：M-010、M-G06、衰减规则只看构造，不清零。
      清零的是 M-Q08：它的比较窗口要求构造与 registry 摘要都不变（`execution_fidelity.comparison_window`）。
      现行构造 `e32f3856ac1e` 下，M-Q08 第一次判定最早约 10-13；10-03 应用会推到约 10-18。
      另要改 `probe_status` 读哪个口径（代码），再重启一次，循环才会读新的 registry 与新代码。
    prereg: b883d01e
    verdict: 3e584cbf
    note: >-
      两个新数看起来更松，实际不是：现在这条规则在 14.6σ 上根本打不响，新的落在它自己声称的
      2.3% 尾部。从「不可触发」变成「按设计触发」是收紧。四条 falsifier（F1 权重逐位不变、
      F2 σ 差 1.38 倍、F3 新阈值不回看触发、F4 两书分位数差 1.49 倍）全部未触发。
      探针自己的 30 天复核在 2026-10-02，正好是窗口前一天。
      ——
      2026-09-30 补两条。其一，复核日：代码按 `accepted_on` + 30 天判，两本书都在 2026-10-03T00:00Z 变
      REVIEW_DUE（`beidou governance calendar`），不是上面写的 10-02。其二，registry 里 flow 的 `max_loss`
      注释写着「随 vol_target 等比例调」（09-04 那次 0.01 → 0.02），09-14（0.30 → 0.60）与 09-27（0.60 → 0.175）
      两次改 k 都没跟。在循环现在读的已实现口径上，这道闸按哪个数都打不响，所以没有影响过交易。本条应用时，
      阈值按上面的规则在应用那天的构造上重定，那条「等比例」注释随之作废。

  - id: vol-target-repricing
    subject: 在冲击成本模型下重推 `vol_target`
    queued: 2026-09-08
    earliest_window: 2026-10-03
    change: >-
      采纳 P26 的重推结果（若采纳）。**2026-09-17 更正：`portfolio.vol_target` 现为 0.60，不是 0.30。**
      这一行写于 2026-09-08，D-035 在 09-14 把 k 换成 0.60（操作者裁定 `96d659ae`，判据从 Sharpe
      改为绝对收益、回撤预算 −70%），循环 09-15 重启后跑的就是 0.60——`cycles.jsonl` 最近一次
      `construction_full` 是 `vol_target: 0.6`，digest `ccd7bb9764b5` 与心跳一致。
    measured: >-
      P26 于 2026-09-08 跑完（`scratchpad/p26_vol_target_under_impact.py`，7 档 vol_target × 5 档资金）。
      **已跑未采纳**——§19/§20 的「仍未做」措辞已于 2026-09-10 更正。
      **2026-09-17 更正：P26 的结论已被 D-035 撤回。** 「argmax k = 0.15，在每个资金档」只在 pit 上
      成立（脚本把 universe 写死了），D-035 写明「只撤回不替换，因为 static 那条曲线跨度只有 0.106、
      没有误差棒」。所以本条现在指向的是一个**没有替代品的空位**：窗口开的时候，要么先重跑 P26
      （两个 universe，价钱见 cost），要么承认没有可采纳的结果并把本条关掉。
      按 09-14 的基线重读还有一件事要注意：E-FQ27 说的「若采纳是往下不是往上」是相对 0.30 讲的，
      当前基线 0.60 使这个「往下」的幅度比该句写下时大一倍。
    why_it_waits: >-
      `vol_target` 在 `construction_fingerprint` 里，采纳它是 Phase 4a 的构造变更。
      §20 另写明：采纳还要按 D-033/D-034 先例重出证据，加账本行、计入 R1。
    cost: 同上（清 M-010 与 M-G06），外加一次证据重出的账本行。
    applied: 2026-09-27 的切换 PR（分支 live/k0175-switch-after-1013）——关掉，不是采纳 P26，见 note
    note: >-
      `live.demo.yaml` 早就把 10 万 USDT 写成「k 需在冲击模型下重推」的触发点，而真实资金仍 Out，
      所以这条是否值得花掉一个窗口，是操作者的判断，不是日期到了就做。
      ——
      2026-09-27 关掉。走的是 `measured` 里写的第二条路：P26 没有可采纳的结果，不重跑。这个窗口的
      `vol_target` 由另一条路定下，并在同一次重启里付清清零的那笔钱：D-035 的回撤规则在诚实漂移、
      可动用口径下取 0.175（RESEARCH_LOG 2026-09-25「抵押品换不了」一节），tsmom 在 0.175 上按预登记
      `b76de7a0` 重出，WEAK_PASS。冲击模型下重推 k 仍然欠着，触发点仍是 `live.demo.yaml` 写的
      10 万 USDT；到那时新开一条，不复用这一条。`applied` 这个字段是这份文件唯一的「不再是待办」，
      所以写在那里，文字说明它是关掉。

  - id: leverage-by-vol
    subject: "交易所杠杆按各交易对的波动率分档（分交易对杠杆报告的 R1，`portfolio.leverage: by_vol`）"
    queued: 2026-09-26
    earliest_window: 2026-09-27
    change: >-
      `portfolio.leverage` 从 `auto`（每个币 5x）改为 `by_vol`：档位 = 离 5 × 0.90 ÷ σ 对数距离最近的一档，
      档位表 1x–15x（k=0.175 下持有的 13 个落在 3x–15x），换档须连续 168 个周期（一周）都要换（24 在 Mac 的
      T-11 回放里一天最多换 9 次，超了上限 5），按当前名义读完整档位表压上限，整本书的初始保证金不超过 `auto`
      要的（超了抬档，不缩单）。构造指纹的 `leverage` 块加 `sigma_ref`、`tiers`、`hysteresis` 三个字段，
      `CONSTRUCTION_PAYLOAD_VERSION` 10 → 11，不加别名。
    measured: >-
      `docs/analysis/2026-09-26-per-symbol-leverage-first-principles.md`（#165）：真实杠杆（名义 ÷ 权益）早已
      按 1/σ 分开（最大/最小 12.9 倍，对数斜率 −0.99），统一的 5x 只决定初始保证金，14 天里保证金预检没有
      缩过一单。k=0.175 下分档后目标书的初始保证金约为权益的 4.1%，5x 时约 6.1%（附录 A）。
    why_it_waits: >-
      `leverage` 块在 `construction_fingerprint` 里，改它是一次构造变更。构造冻结原定到 2026-10-13，操作者
      2026-09-27 提前结束，#163 同日合入。#163 的切换重启带着 k 0.175 与可动用口径，报告的 D-007 要求本改动
      不进那一次。所以最早的日期是 09-27，真正的前置不是日期（NA-3）：#163 已合并、Mac 已快进、切换那次
      重启跑稳。
    cost: >-
      清零 M-010 的 30 天窗口、重启 M-G06——任何一次构造变更都要付的同一笔钱，操作者在卡片上接受了。订单
      不受影响：权重与订单在读杠杆之前就定了（T-6 的回放核对逐单一致、预检不缩单）。
    applied: "#186（交易所分档 `by_vol`，分支 claude/adaptive-leverage-analysis-zvraep），合并后按 CLAUDE.md 的纪律重启一次"
    note: >-
      操作者 2026-09-26 在卡片上选了「交易所也分档」，没选推荐的「只改说明」（O-1，#175 已合并）。它不改经济：
      回报与风险由真实杠杆决定，要动回报得动保证金构成（同日卡片 2「只放 USDT」：真实账户上线前按全 USDT
      重推 k），不是交易所那一栏。回滚是一行 `leverage: auto` 加一次重启。
