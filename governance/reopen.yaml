  - id: residual
    subject: residual
    ruled: 2026-09-09
    verdict: 重测 FAIL（差 0.01），REFUTED 维持
    condition: 与 carry 同形——新的信息，不是新的网格。不加宽、不收窄、不重开。
    check: operator
    note: >-
      2026-09-17（操作者裁定 Q-SF1）：**「新信息」这一条被行使过一次，用掉了，结果 FAIL。**
      提出的新信息是 pit 上的 IC-by-horizon 表（336h NW t 4.16 / 720h 3.63，而 registry 的
      `horizons [24,72,168]` 里两个不显著或为负），据此把周期换到信息所在处。作者在预登记里
      声明过它带选择污染（`[168,336,720]` 已是 09-09 与 09-17 两次网格的 `best_params`），
      按 P31 先例「先声明污染，再跑」。运行 `residual-validation-20260917T145128Z`（单点，
      `--grid '{}'`，计费 1 笔，去重后 N 16 → 17）：**样本外 1.0484 对门 1.2046，差 −0.1561，
      ① 挂；②③④ 全过**（fold 一致 0.80、CPCV 负路径 0.00、成本 ×2 0.8915、与在跑的书相关
      0.2624、成本占毛利 10.8%）。这正是预登记写下的那一种结果，处置也是预登记写好的：
      **不重跑、不换网格、不申诉门。** 此后 residual 只能靠**新数据列**重开（OI / 多空比 /
      basis 三列在库，未被 09-16 那次撤源波及），那是另一条假设、另一份预登记。
      一条判据之外的读数，记下但不外推：`correlate-tsmom-residual-20260917T145230Z` 的
      **等权双流**边际 tsmom +0.7921 / residual **−0.2261**——那不是 `research book` 的
      D-018 风险预算逐 fold 边际，两把尺子不可换算（P20 的注记），所以它不构成「进 book 会被拒」。
      ---
      2026-09-19：行使了一个**新的**重开理由，理由不是上面 `condition` 写的「新信息」
      ——**那一条已经用尽，未主张**——而是「从未用 F4 自己的判据测过」：
      F4（M-AE01）判的是组合层等风险 ΔSharpe/ΔMDD，而 residual 死在单书 D-028 选择门上，
      两把尺子回答两个问题。该理由对其余被否候选不成立（xsmom 已死在相关性闸、chanlun corr
      0.6426、breakout 与 meanrev 死因明确不在这道判据上），所以它不是一条通用绕过。
      **操作者 2026-09-19 批准了该理由，已运行，结果 REJECT，这条路就此关闭。**
      `book-tsmom-residual-20260918T184016Z`：六条挂五条（ΔSharpe +0.03 对门 0.10、等风险回撤
      −0.420 → −0.496、fold 胜率 0.40 对 0.6、成本 ×2 后 −0.11、static robustness −0.03），
      只有 `cpcv_negative` 过。计费与预登记一致：ledger 22,181 → 22,183，本桶 18 → 20，
      单书门 → 1.2205。处置照预登记：**不重跑、不换 fraction、不申诉门。**
      **真死因是换手**：`turnover_ratio_to_main` **7.71** 对 §3 的限 3.0，sleeve 的
      `cost_share_of_gross` 51.98%，成本翻倍即转负。所以此前三轮记的「只挂一道门、有信息但
      过不了多重检验」（PR #46 死因 ④）在组合层上不成立——它挂五条，而最结构性的一条与 N、
      与多重检验、与门严不严都无关。这条线上 residual 现在与 breakout 同因。
      重开条件仍然只有原 `condition` 的**新数据列**，且「换判据」这条已被行使并用尽。
    log: 2026-09-09 块 6 裁决之三；2026-09-17 Q-SF1 行使并用尽；2026-09-19 预登记、批准、运行、REJECT

