  - id: mined-594a12f9
    subject: 挖掘候选 `mined_594a12f9307a15d9`（cs_rank(ret(336) / semi(ret(1), 168))）
    ruled: 2026-09-12
    verdict: 结项（P21 REJECT、P30 两个 cap 臂再 REJECT，三次都只挂在 D-018 的 oos_mdd_worsening 上）
    condition: >-
      这条候选不是被证伪的——它 validate PASS、边际 +0.24、五折赢四折、两个 universe 同向、成本 x2 过门，
      挂的只有回撤（pit +4.98pp 对门 1pp；加 cap 后 +2.52 / +2.69pp）。三者任一成立即重开，且都要新预登记：
      (1) 有人按一条**先验**规则给出 fraction 而不是在结果上挑——例如「让 sleeve 的平均敞口等于主书的 1/3」，
      即 f = (1/3) x 0.859 / 1.358 = 0.211；写这条预登记时必须声明它带着选择污染（P30 §四：这个想法是在
      看到 cap 0.86 的 fraction 0.20 上下文行六项全过之后才成形的）；(2) 操作者按 R10 显式改 D-018 的
      max_oos_mdd_worsening，且新阈值由独立于本候选的推导得出（例如 D-035 的 50% 回撤预算自助）；
      (3) 冲击成本可校准之后重新定价——它的成本敏感度是主书的数倍（成本 x2 时跌破自己 validate 的 D-028 门）。
    check: operator
    note: >-
      条件 (1) 已于 2026-09-12 由操作者授权行使（P31），**用掉了，结果 REJECT**：规则 f = (1/3) x 0.8591 / 1.3725
      = 0.209，F1 落地误差 0.17%，六项里仍然只挂 oos_mdd_worsening（pit +2.55pp 对门 1pp）。
      **不要再跑第五个 fraction**：P31 用两份报告里已有的点量出，0.200 -> 0.209 这一段 pit 的斜率是
      138.7 pp/单位 f，是更宽区间的 7-10 倍，而 static 在同一段上符号为负——这道门的统计量是单条路径上的
      极大值，在门附近对 fraction 不稳，不足以支撑一次挑选。这条读数同时加强了条件 (2)：它给了一个
      候选之外的理由。
      明写**不构成**重开理由的两条：一是 `--sensitivity` 的上下文行（0.20 / 0.50）——代码注释就写着
      never a decision input，P21 与 P30 各拒绝过一次；二是给它套 sleeve 敞口上限——P30 已经量过，
      与同等平均敞口的 uniform fraction 相比两个 cap 臂的符号都跨 universe 翻转，cap 不是那个杠杆。
      另记：它的 turnover_ratio_to_main 是 4.37，超治理 §3.6 的 3x，且 cap 不改变这个数（那道门读的是
      sleeve 的 standalone 换手）；操作者 2026-09-12 表示愿意为它单独预登记一次 R10 变更，但 book 那道门
      先挂，所以那一步现在仍排在后面。

      2026-09-17（操作者裁定）：**条件 (2) 授权行使**，且授权时已知它在今天的 k 上收紧而不是放宽。
      独立推导写死在 RESEARCH_LOG 2026-09-17 的 EXP-AE2：门 = 声明预算 − 主书自助 q95 MDD，两 universe
      取更紧的那个。k=0.60（在跑）得 **0.3pp**，比现行 1pp 更紧；k=0.45 得 6.9pp、k=0.30 得 19.7pp。
      所以条件 (2) 与重开 P32（降 k）是同一个决定的两半，在 0.60 上单独行使它对每个未来候选都更难。
      规则变更走 R10（POLICY_VERSION + 测试 + 那段预登记），**只适用此后候选**，本候选重测照付 ledger，
      且不早于 2026-10-13T19:00Z（冻结 + K-EX14）。本轮只写推导，未改 policy.py 的任何常量。
      另记：条件里没写而 2026-09-17 的分析查清的一条——**等风险重定标不是未测的第四条路**。
      RESEARCH_LOG:2811-2870（2026-09-07）已量：缩回主书波动率后 Sharpe +0.288 保住、回撤 +4.27pp →
      +1.87pp 仍 > 1pp，主书与总书 MDD 同在 2023-05-03（相关 0.236 但尾部同向），该节 §五 已裁定
      「它不能用来救这个候选」；`beidou_alpha/validation/book_limits.py` 的
      `oos_mdd_worsening_equal_risk` 就是它的实现。把它当新路提出来会是第五次同形尝试。
    log: 2026-09-12 P30 裁决

