      0.2624、成本占毛利 10.8%）。这正是预登记写下的那一种结果，处置也是预登记写好的：
      **不重跑、不换网格、不申诉门。** 此后 residual 只能靠**新数据列**重开（OI / 多空比 /
      basis 三列在库，未被 09-16 那次撤源波及），那是另一条假设、另一份预登记。
      一条判据之外的读数，记下但不外推：`correlate-tsmom-residual-20260917T145230Z` 的
      **等权双流**边际 tsmom +0.7921 / residual **−0.2261**——那不是 `research book` 的
