  - id: meanrev
    subject: meanrev
    ruled: 2026-09-09
    verdict: REFUTED 维持（不重测：「改变的条件动不了死因」）
    condition: >-
      先实现最长持有期（round 1 写的 12–24 bar）与更强的趋势门，在 pit 上重出等名义诊断；只有当零成本
      Sharpe 由 −0.62 转正之后，才谈 validate。不是新网格——`trend_gate_z` 的 27 格已经跑过且全负。
      【2026-09-17 同日行使完毕，门没过，见 note。此后重开需要一条**新的机制假设**，不是这条药方的
      第三个参数值。】
    check: operator
    note: >-
      **这条条件由 2026-09-17 的诊断提出，同日经操作者裁定采纳（「根据推荐处理」），现在是一道门。**
      裁决节（2026-09-09 块 6）没有写过重开条件，这是第一条。依据：206 币 pit 上 1h 横截面 IC +0.0159、
      NW t **7.64**（round 1 在小 universe 上记的 t 6.8 复现了），时序 IC 七个前瞻期全正，
      而等名义零成本 Sharpe **−0.62**——信息在排序里，亏损在尾部（720h 空头桶平均前瞻收益 +14.77%）。
      round 1 开的药方（时间止损 + 更强趋势门）当时未实现：`max_hold` / `hold_bars` / `time_stop` /
      `TimeExit` 在三个包里 grep 零命中。
      **2026-09-17（操作者「把 meanrev 的时间止损实现出来」）：药方已实现并行使，门没过。**
      `MeanrevParams.max_hold_bars`（默认 0 = 关）+ 11 条测试；`research diagnose` 在 pit 上跑了八格
      （`trend_gate_z` ∈ {1.0, 1.5, 2.0} × `max_hold_bars` ∈ {12, 24, 48}）：**没有一格转正，也没有
      一格好过基线的 −0.62**（−0.66 @ 48 bar，−0.76/−0.80 @ 12/24，最严的门 −0.87）。零 ledger。
      **失败的形状证否的是机制不是参数**：收紧时钟与门把绝对亏损从 −0.0981 减到 −0.0637（−35%）、
      回撤同向改善，但它是靠砍敞口做到的（0.062 → 0.026，−58%），Sharpe 反而更差——一个真抓住尾部的
