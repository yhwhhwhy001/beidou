  - id: drawdown-budget-denominator
    subject: P13 / R8 回撤预算的分母——70% 是总权益的 70%，而一半总权益开不了仓
    ruled: 2026-09-20
    verdict: >-
      判据侧**维持总权益**。不是因为操作者的口径不对——那个口径是对的，报告侧已经按它改完
      （PR #93）——而是因为重跑 D-035 的 bootstrap 之后，换分母买不到那个预算：付约 13pp 年化，
      q95(USDT) 仍在 −106%，突破 70% 的概率 94.5%。花钱买一个还是没达成的门不是风险管理。
    condition: >-
      2026-10-13 冻结解除后重新裁定一次。日期只是必要条件。要答的不是「档位设在哪」——bootstrap
      已经答过，档位不是那根杠杆——而是 **`k` 设在哪**，而 `k` 扫描（2026-09-22）已经把那个数测
      出来了：**k ≈ 0.30–0.35**，代价约 45pp 年化、约 38% 的预期收益。所以到点要裁的不再是一个
      未知数，而是一次取舍：**用约 38% 的预期收益，换把可动用资金的尾部从 q95 −120% 拉进 −70%
      以内。** 这次裁定仍然需要人，因为 0.30 与 0.35 之间那条线是风险偏好而不是测量——严格按 q95
      读是 0.30（P 0.9%），按突破概率读 0.35 已经只有 7.4%。
      `vol_target` 在构造指纹里，动它清零 M-010、M-G06 与 `realised_vol`。
    measured: >-
      2026-09-20，`scratchpad/p32f_usdt_denominated_budget.py`，2000 draws，pit 与 static 两个
      universe，mtm ruler（2026-09-14 起上线的那把；income-only 那把五年零次触发）：
      现行梯（−49%/−70%，budget 按总权益）q95(总) **−67.7% / −66.3%**，在声明的 −70% 以内，
      突破概率 3.1% / 2.5%——**它守得住它自己被问的那个预算**，复现 D-035 引用的 −66.5%。
      同一条路径换成可动用资金读作 q95(USDT) **−126.0% / −123.4%**，突破 70% 的概率 **97.0% / 96.0%**。
      按 USDT 重新推导的梯（−26%/−38%，即 budget 37.62% = 0.70 × U_peak/E_peak，
      U_peak/E_peak = 6,647.18 / 12,368.22 = 0.5374）：CAGR 中位 119.2% → **106.0%**（static
      117.3% → 104.2%），梯本身的代价 0.45pp → **14.40pp**，触发率 57.5% → **98.5%**；买到的是
      q95(USDT) −126.0% → **−106.7%**，突破概率仍有 **94.5% / 93.7%**。
      真正的读数在中位那一格：一条 5.6 年抽样路径的中位总权益回撤就是 **−51.6%**，换成可动用资金
      是 **−96%**。换分母没有制造这个风险，它只是把风险显出来了——那个 70% 预算，从来就不是可动用
      资金上的 70%。
      三条误差全部指向同一边（真实尾部更差）：周期块 bootstrap 抹掉多月 regime 结构（A-003 自己
      声明的构造性乐观）；换算假设亏损全落在 USDT，而 BTC 与书同跌时 `E_peak` 也会掉；CAGR 的
      绝对水平是 bootstrap 在一本高杠杆加密动量书上的产物，只有差值有意义。
      ——
      2026-09-22 补，`scratchpad/p32g_which_k_holds_the_usdt_budget.py`，同样 2000 draws / 两个
      universe：**`k` 扫下来 0.30 是第一个守得住的**（q95(USDT) −65.1%，突破概率 0.9%，CAGR
      74.1%），0.35 差一点（−71.8%，7.4%，84.3%）。上面 `condition` 原本写的粗估是 k≈0.39，
      **实测更低**，因为回撤对 `k` 不是线性的——那正是那句粗估自己声明过的。
      这一跑还**修正了上面结论的一半**。「档位不是那根杠杆」在 k=0.60 上成立，但扫描里加的
      `no ladder` 对照臂显示**梯本身在每个 `k` 上都划算**：要 q95(USDT) ≈ −80%，`k=0.40 + 梯`
      给 92.1% 年化，`k=0.30 无梯`只给 77.2%，梯多赚 14.9pp；≈ −90% 那一档多赚 15.6pp。所以梯
      与 `k` 是互补不是替代，梯是每单位回撤削减里更便宜的那个，它只是在 k=0.60 上够不到 −70%。
      到点裁定时这一条要一起读，否则「梯没用，只能砍 `k`」会是个便宜三成的错误结论。
      另一个读数，同样属于这次裁定：**k=0.60 时梯的触发率是 100%**，每条抽样路径都踩过刹车。
      一个永远在响的刹车不是刹车，是一本更小的书外加额外换手；`k` 降到 0.30 时是 68.5%。
      最后一条是关于这些数字自己的保质期：换算因子 `U_peak/E_peak` **不是账户的常数**。09-20 是
      0.5374，09-22 是 0.5652，**两天漂了 +5.16%**——抵押品几乎不动（269 个周期里只占全部绝对
      权益变动的 5.25%），所以书每赚一分都落在 USDT 上、抬高 USDT 占比，同一笔总权益回撤在可动
      用口径下就读得越来越浅。上面两组读数分别跑在这两个因子上（`p32f` 1.861、`p32g` 1.769），
      到 10-13 重裁时要先重测它，别直接拿这里的百分比去比。
    check: date_after
    args:
      date: '2026-10-13T00:00:00+00:00'
    note: >-
      和 `risk-g11-denominator` 是同一件事的两个仪表，落在同一个冻结上，到期要一起裁。
      报告侧已经改完（PR #93）：日报的 P13 段并排印两个口径，`usdt_drawdown_state` 另立 USDT 自己
      的高水位，并把换算后的两档印出来（`rungs_in_this_denominator`：**2026-09-20 读作**
      de-escalate 91% / rollback 130%，那是按当天因子 1.861 算的；09-22 因子 1.769 下是
      87% / 124%。仪表每次现算，这里两个都是当日读数而不是常数——见 `measured` 末段）——
      **报告，不动作**，和 `attributed_drawdown_state.equity_over_peak` 同一个形状。
      它推翻了一个主动做过的决定而不是一次疏忽：A-GB01（2026-09-15）明确选择不在 USDT 序列上另立
      高水位（「would be a FOURTH ruler」），代价是页面上那个 6.58% 量在两条序列之间——09-16T02:00Z
      新尺子读 11.40% 的那一刻，页面印的是 5.92%。
    log: >-
      2026-09-20 回撤按可动用 USDT 重新定价：换分母不制造风险，它把风险显出来；
      2026-09-22 k 扫描：梯和 k 是互补不是替代，而守住 70% 可动用预算要 k ≈ 0.30–0.35
