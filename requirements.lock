# 关于 mypy==2.3.1 的一句说明：
# 这里钉的是**当前**解析到的 2.x，不是回退到 1.x。回退能让 CI 立刻变绿，但那是把已经暴露出来的
# 三处真实契约漏洞（engine.py 越过 SignalModel 端口读 entries、reports.py 的 wakes 类型自相矛盾、
# risk_budget.py 在 `Mapping | None` 上直接 .get）重新盖回去。这些正由另外的改动逐个修；
# 本文件的职责只是让"用哪个 mypy"这件事不再每天变一次。
