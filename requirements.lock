# ==============================================================================
# 北斗 V5 — 依赖锚（requirements.lock）
# ==============================================================================
#
# 这是什么
# --------
# `pyproject.toml` 里的依赖写的是**范围**（`pandas>=2.2`、`mypy>=1.10`），范围是给库使用者的。
# 但 CI 与本地开发不该每次重新解析到"当天的最新版"——2026-09-09 就是这么炸的：
# `mypy>=1.10` 解析到了 2.x，收窄规则变严，30 个错误一次冒出来，CI 连续 23 次失败 4 天，
# 期间 `pytest` 那一步**一次都没跑过**。本文件把那次事故的缺口堵上：CI 与开发环境按这里的
# 精确版本安装，版本的升级从此是一次**显式的提交**，而不是某天早上的意外。
#
# ⚠️ 时间边界：这是**从 2026-09-13 起**的锚，**不是**对此前证据的追溯声明
# ------------------------------------------------------------------------------
# `reports/research/` 里那几十份逐位可复现的报告，其数值取决于**当时解析到的** pandas/numpy。
# 那是哪一版，仓库里**没有任何记录**——`pyproject.toml` 只写了 `pandas>=2.2` / `numpy>=1.26`，
# 没有 lockfile，报告本身也没有记录 `pandas.__version__`。
# 所以：**不要**把这个文件读成"历史证据都是在 pandas 3.0.5 / numpy 2.5.2 下跑出来的"。
# 那是一个会误导人的推论。正确的读法是：
#   · 2026-09-13 之后新产生的证据，可以声称是在这套版本下跑的；
#   · 2026-09-13 之前的证据，版本未知，若要与新证据做逐位比对，必须重跑，不能靠这个文件背书。
# （补 validate 报告里记录 `pandas.__version__` / `numpy.__version__` 是另一件事，
#   与 registry 指纹、construction_fingerprint 同一条理由，不在本文件范围内。）
#
# 怎么来的
# --------
# 锚点是 2026-09-13 当天本机 `.venv`（CPython 3.12.14）已解析出的版本。做法不是整个
# `pip freeze`——那个 venv 里还有 bandit / black / pre-commit / psycopg 等与本项目无关的
# 顺手装的工具——而是从 `pyproject.toml` 声明的根依赖出发，按 `importlib.metadata` 走**传递闭包**，
# 再用 venv 里的实际版本钉住。环境标记（marker）按 CPython 3.12 + linux/darwin 取并集求值，
# 所以 `tomli`（py<3.11）、`colorama`（win32）、`tzdata`（win32/emscripten）都不在这里，是对的。
#
# 怎么用
# ------
#   pip install -r requirements.lock
#   pip install -e . --no-deps          # 项目自身，不让它再去解析依赖
# CI（`.github/workflows/ci.yml`）就是这两行。
#
# 怎么升级
# --------
# 不要手改单行版本号。在一个干净的 3.12 venv 里 `pip install -e ".[dev]"` 让它重新解析，
# 重跑闭包，把结果整体替换进来，**并在同一个提交里跑完 `ruff` / `mypy` / `pytest -m "not network"`**。
# 升级 pandas/numpy 的提交要在 commit message 里写明：此后的证据与此前的证据不再逐位可比。
#
# 不在这里的东西
# --------------
# · research extras（scipy / statsmodels / matplotlib）：CI 不装，本机 `.venv` 当前也没装，
#   所以本文件没有它们的版本可锚。若将来要锚，单开 `requirements-research.lock`，
#   不要混进这里——混进来会让 CI 的安装面无谓地扩大一倍。
# · 哈希（`--require-hashes`）：本文件只钉版本，不钉哈希。钉哈希要求所有间接依赖都带 hash，
#   且与 `pip install -e .` 不兼容（editable 装不了 hash 校验），留给以后真要做供应链校验时再说。
# · 项目自身 `beidou`：由 `pip install -e . --no-deps` 安装，不出现在锁里。
#
# ==============================================================================


