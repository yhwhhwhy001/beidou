# 北斗 V2.0 本地开发环境 — Docker Compose
# Phase 1 (BD-03): PostgreSQL + Redis + MinIO
# 默认仅绑定 localhost

services:
  postgres:
    image: postgres:16-alpine
    container_name: beidou-postgres
    environment:
      POSTGRES_DB: beidou_testnet
      POSTGRES_USER: beidou_app
      POSTGRES_PASSWORD: beidou_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beidou_app -d beidou_testnet"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: beidou-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: beidou-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: beidou_admin
      MINIO_ROOT_PASSWORD: beidou_dev_minio_password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migration:
    image: postgres:16-alpine
    container_name: beidou-migration
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: []
    command: >
      sh -c "
      for f in /migrations/*.up.sql; do
        echo \"Running: $$f\";
        PGPASSWORD=beidou_dev_password psql -h postgres -U beidou_app -d beidou_testnet -f \"$$f\";
      done
      "
    profiles:
      - init

volumes:
  postgres_data:
  minio_data:
