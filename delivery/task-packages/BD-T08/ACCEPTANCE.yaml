criteria:
- id: AC-BD-T08-01
  statement: 业务 Intent 与 Outbox 不会出现单边提交。
  mandatory: true
  evidence_required: true
- id: AC-BD-T08-02
  statement: crash-before-send 不丢消息；crash-after-send 不重复订单。
  mandatory: true
  evidence_required: true
- id: AC-BD-T08-03
  statement: 双 worker 竞争时同一消息只有一个有效发送者。
  mandatory: true
  evidence_required: true
- id: AC-BD-T08-04
  statement: 重启后 pending/unknown/dead-letter 状态完整恢复。
  mandatory: true
  evidence_required: true
commands:
- pytest tests/integration/outbox -q
- pytest -q -k 'outbox and (crash or idempotent or double_worker or unknown or dead_letter)'
failure_rule: 任一 mandatory criterion FAIL 或缺少关键证据时任务不得 PASS；存在 P0 时必须 FAIL。
