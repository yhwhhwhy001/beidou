# ===================================================================
# 北斗 V2.0 环境配置 — 测试/生产 API 配置
# ===================================================================
# 复制此文件并重命名为 env.{environment}.yaml 填入实际值。
# 密钥引用 Vault/KMS, 不得在此文件中填入明文 API Key/Secret。
#
# 激活: export BEIDOU_ENV=testnet
# 对应: config/env.testnet.yaml
# ===================================================================

environment:
  name: testnet         # testnet | staging | production
  log_level: DEBUG       # DEBUG | INFO | WARNING | ERROR
  clock_domain: REALTIME # 启动模式: REALTIME | NEARLINE | OFFLINE | FULL

# -------------------------------------------------------------------
# 交易所 API 配置 (Vault 引用 — 不填明文密钥)
# -------------------------------------------------------------------
exchange:
  binance_usdm:
    enabled: true
    testnet: true
    # Vault 密钥引用路径 (实际密钥存入 Vault/K8s Secrets)
    vault_path: secret/beidou/testnet/binance
    # 以下为配置项，值从 Vault 注入或通过环境变量覆盖:
    #   - api_key:      BEIDOU_BINANCE_API_KEY
    #   - api_secret:   BEIDOU_BINANCE_API_SECRET      ← 发送前脱敏, 不打印日志
    #   - passphrase:   BEIDOU_BINANCE_PASSPHRASE (如有)
    rest_base_url: https://testnet.binancefuture.com
    ws_public_url: wss://testnet.binancefuture.com/ws
    ws_private_url: wss://testnet.binancefuture.com/ws  # 需 listenKey
    recv_window_ms: 5000
    rate_limits:
      orders_per_second: 10
      orders_per_day: 200000
      websocket_connections: 5
      max_listenkey_ttl_seconds: 86400

  # 预留: 多交易所扩展
  # okx:
  #   enabled: false
  #   testnet: true
  #   rest_base_url: https://www.okx.com
  #   vault_path: secret/beidou/testnet/okx
  # bybit:
  #   enabled: false
  #   testnet: true
  #   rest_base_url: https://api-testnet.bybit.com
  #   vault_path: secret/beidou/testnet/bybit

# -------------------------------------------------------------------
# 数据库连接
# -------------------------------------------------------------------
postgresql:
  host: localhost
  port: 5432
  database: beidou_testnet
  user: beidou_app
  # password: 通过 Vault 或环境变量 BEIDOU_DB_PASSWORD 注入
  pool_min: 2
  pool_max: 10
  ssl_mode: prefer
  application_name: beidou-safety-executor

clickhouse:
  enabled: false          # 分析层可后置部署
  host: localhost
  port: 9000
  database: beidou_analytics
  user: default

kafka:
  enabled: false
  bootstrap_servers:
    - localhost:9092
  consumer_group: beidou-testnet
  topics:
    market_data: beidou.testnet.market
    orders: beidou.testnet.orders
    executions: beidou.testnet.executions
    risk_events: beidou.testnet.risk

# -------------------------------------------------------------------
# Vault / KMS
# -------------------------------------------------------------------
vault:
  enabled: false          # 开发阶段可关闭, 直接用环境变量
  addr: http://localhost:8200
  token_path: /var/run/secrets/vault-token
  # 支持 Kubernetes Auth / AppRole / Token

# -------------------------------------------------------------------
# 安全与密钥管理
# -------------------------------------------------------------------
security:
  credential_types: ["MARKET_READONLY", "ACCOUNT_READONLY", "TRADING"]
  # 交易密钥必须满足:
  #   - can_withdraw: false (提款权限无条件拒绝)
  #   - ip_whitelisted: true
  key_rotation:
    enabled: false
    default_ttl_days: 90
    rotation_overlap_seconds: 300  # 新旧密钥 5 分钟重叠

# -------------------------------------------------------------------
# 生产阶梯 (L0-L5)
# -------------------------------------------------------------------
production_ladder:
  current_level: L0_PAPER
  capital_limits:
    L0_PAPER: 0.0
    L1_SHADOW: 0.0
    L2_CANARY: 100.0
    L3_RAMP: 1000.0
    L4_NORMAL: 10000.0
    L5_CHAMPION: 50000.0

# -------------------------------------------------------------------
# 测试/认证参数
# -------------------------------------------------------------------
testing:
  g5_testnet:
    scenarios:
      - idempotency
      - rate_limit
      - partial_fill
      - cancel_race
      - conditional_orders
      - user_data_stream
      - reconciliation
    fail_fast_on_p0: true

  g6_shadow:
    min_runtime_hours: 24
    instruments:
      - BTCUSDT
      - ETHUSDT
    max_theoretical_orders: 10000

  chaos:
    enabled: false
    scenarios:
      - exchange_unreachable
      - database_connection_loss
      - kafka_broker_failure
      - high_latency_spike
      - partial_data_corruption

# -------------------------------------------------------------------
# 可观测性
# -------------------------------------------------------------------
observability:
  trace:
    enabled: true
    sampling_rate: 1.0         # 测试环境全量采样
    export_format: otel
  metrics:
    prometheus_port: 9090
    scrape_interval_seconds: 15
  logging:
    format: json               # json | text
    redact_secrets: true       # 自动脱敏 SENSITIVE_KEYS
    max_body_length: 4096

# -------------------------------------------------------------------
# 性能基准
# -------------------------------------------------------------------
performance:
  # 引用 config/performance_budget.yaml 中的阈值
  # 测试环境可放宽:
  test_relaxation_factor: 2.0  # 测试环境阈值 ×2
