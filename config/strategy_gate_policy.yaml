# BF-10: 策略晋级门禁 Policy

policy_version: "2.0.0"

strategy_gates:
  DRAFT_to_BACKTEST:
    required_evidence:
      - strategy_definition_frozen
      - factor_versions_bound
      - no_circular_dependency
      - policy_thresholds_from_config

  BACKTEST_to_PAPER:
    required_evidence:
      - parity_backtest_paper_match
      - no_data_leakage
      - cost_model_valid
      - risk_budget_defined
    allowed_discrepancy: "execution_simulation_only"

  PAPER_to_TESTNET:
    required_evidence:
      - paper_shadow_complete
      - min_runtime_hours: 336  # 14 days
      - min_trades: 100
      - max_deviation_from_backtest_pct: 20.0
      - no_p0_incidents

  TESTNET_to_ACTIVE:
    required_evidence:
      - testnet_runtime_complete
      - live_attribution_verified
      - drift_within_threshold
      - capacity_utilization_safe
    mainnet_prohibited: true

parity:
  required_modules:
    - FeatureRuntime
    - FactorRuntime
    - TypedAlphaGraphExecutor
    - SignalFusion
    - PortfolioOptimizer
    - StrategyRisk
    - ExitPolicy
  allowed_replacements:
    - MarketIO
    - Clock
    - ExchangeIO
    - PersistenceAdapter
