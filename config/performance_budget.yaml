# 北斗 V2.0 性能预算注册表
#
# 所有热路径必须在此注册 P50/P95/P99 预算、
# 参考硬件、测量方法和退化阈值。
# Python 实现未达标且优化无效时，热路径可通过稳定 FFI 使用 Rust。
# 禁止无证据提前重写。

hot_paths:
  # --- 实时安全与执行层 ---
  market_data_ingest:
    description: "行情数据接收与解析"
    clock_domain: REALTIME
    p50_ms: 1.0
    p95_ms: 5.0
    p99_ms: 10.0
    throughput_per_second: 5000
    max_memory_mb: 256
    reference_hardware: "AWS c7i.xlarge (4vCPU, 8GB RAM)"
    measurement_method: "Prometheus histogram over 1h at 100% reference load"
    degradation_threshold_pct: 20.0

  orderbook_rebuild:
    description: "本地订单簿重建（每 tick 增量更新）"
    clock_domain: REALTIME
    p50_ms: 0.5
    p95_ms: 2.0
    p99_ms: 5.0
    throughput_per_second: 20000
    max_memory_mb: 512
    reference_hardware: "AWS c7i.xlarge (4vCPU, 8GB RAM)"
    measurement_method: "Per-tick timing over 1h with full depth feed"
    degradation_threshold_pct: 20.0

  pre_risk_check:
    description: "Pre-Risk 同步不变量检查"
    clock_domain: REALTIME
    p50_ms: 0.5
    p95_ms: 2.0
    p99_ms: 5.0
    throughput_per_second: 2000
    max_memory_mb: 128
    reference_hardware: "AWS c7i.xlarge (4vCPU, 8GB RAM)"
    measurement_method: "Per-check timing over 1h at peak order rate"
    degradation_threshold_pct: 10.0

  risk_decision:
    description: "完整 Risk Decision 评估"
    clock_domain: REALTIME
    p50_ms: 2.0
    p95_ms: 10.0
    p99_ms: 20.0
    throughput_per_second: 500
    max_memory_mb: 256
    reference_hardware: "AWS c7i.xlarge (4vCPU, 8GB RAM)"
    measurement_method: "Per-decision timing over 1h at peak order rate"
    degradation_threshold_pct: 20.0

  intent_commit:
    description: "Order Intent 提交 (Outbox-Inbox)"
    clock_domain: REALTIME
    p50_ms: 1.0
    p95_ms: 5.0
    p99_ms: 10.0
    throughput_per_second: 500
    max_memory_mb: 128
    reference_hardware: "AWS c7i.xlarge (4vCPU, 8GB RAM)"
    measurement_method: "Per-commit timing over 1h at peak intent rate"
    degradation_threshold_pct: 20.0

  executor_dispatch:
    description: "Executor 订单发送与确认"
    clock_domain: REALTIME
    p50_ms: 5.0
    p95_ms: 20.0
    p99_ms: 50.0
    throughput_per_second: 200
    max_memory_mb: 256
    reference_hardware: "AWS c7i.xlarge (4vCPU, 8GB RAM)"
    measurement_method: "End-to-end from send to exchange ack over 1h"
    degradation_threshold_pct: 30.0

  # --- 近线策略层 ---
  feature_computation:
    description: "特征计算（单品种单周期）"
    clock_domain: NEARLINE
    p50_ms: 10.0
    p95_ms: 50.0
    p99_ms: 100.0
    throughput_per_second: 100
    max_memory_mb: 512
    reference_hardware: "AWS c7i.2xlarge (8vCPU, 16GB RAM)"
    measurement_method: "Per-feature-set timing over 24h window"
    degradation_threshold_pct: 20.0

  alpha_signal_generation:
    description: "Alpha 信号生成（单策略）"
    clock_domain: NEARLINE
    p50_ms: 5.0
    p95_ms: 20.0
    p99_ms: 50.0
    throughput_per_second: 500
    max_memory_mb: 256
    reference_hardware: "AWS c7i.2xlarge (8vCPU, 16GB RAM)"
    measurement_method: "Per-signal timing over 24h"
    degradation_threshold_pct: 20.0

  portfolio_optimization:
    description: "组合优化求解"
    clock_domain: NEARLINE
    p50_ms: 50.0
    p95_ms: 200.0
    p99_ms: 500.0
    throughput_per_second: 10
    max_memory_mb: 1024
    reference_hardware: "AWS c7i.2xlarge (8vCPU, 16GB RAM)"
    measurement_method: "Per-optimization run timing"
    degradation_threshold_pct: 30.0

  # --- 离线研究层 ---
  dataset_versioning:
    description: "数据集版本化与 Lineage 记录"
    clock_domain: OFFLINE
    p50_ms: 1000.0
    p95_ms: 5000.0
    p99_ms: 30000.0
    throughput_per_second: 5
    max_memory_mb: 4096
    reference_hardware: "AWS c7i.4xlarge (16vCPU, 32GB RAM)"
    measurement_method: "Per-dataset snapshot creation"
    degradation_threshold_pct: 50.0

  backtest_run:
    description: "单策略完整回测"
    clock_domain: OFFLINE
    p50_ms: 60000.0
    p95_ms: 300000.0
    p99_ms: 900000.0
    throughput_per_second: null
    max_memory_mb: 8192
    reference_hardware: "AWS c7i.4xlarge (16vCPU, 32GB RAM)"
    measurement_method: "Wall-clock time per backtest run (1y data, 1m bars)"
    degradation_threshold_pct: 50.0

# --- 性能降级阈值 ---
degradation_rules:
  exceed_p95: "触发告警，记录性能事件"
  exceed_p99: "触发告警 + 自动性能 Profile"
  exceed_p99_2x: "触发 P1 事故 + 禁止新策略上线"
  exceed_p50_3x: "触发 P0 事故 + 可能触发自动降级/回滚"
