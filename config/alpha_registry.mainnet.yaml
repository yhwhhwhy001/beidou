# mainnet 小额校准循环的 registry（切换方案 M2，2026-10-19；操作者卡片「不算，现在做」：mainnet 有自己的
# registry 与阶梯，demo 的 digest 不动，09-30 的 60 天冻结不受影响）。
#
# 信号与 config/alpha_registry.yaml 相同：只有 tsmom 启用，参数逐字相同，参数的来历写在那份文件里。
# `tests/live/test_the_mainnet_profile_differs_from_demo_only_where_it_must.py` 核对两份启用的策略逐字相同，
# 只许 `evidence` 与 `probe` 不同。demo 那份停用的策略这里不列：它们不进模型，列出来只是要人去核的行。
#
# `evidence` 与 `probe.stop` 都是 k = 0.50 上的（2026-10-19，预登记 76b996ce，结果见 docs/RESEARCH_LOG.md
# 同日「结果：mainnet 的 tsmom 证据按 k = 0.50 重出」一节）。k 再变，两样要一起重出、重量：证据门拒绝构造对不上的
# 证据，`tests/governance/test_the_batch_window_has_a_list.py` 拒绝 `measured_at` 对不上的止损。
version: 1
universe: []
ensemble:
  method: mean
  turnover_penalty: 0.0
strategies:
  - id: tsmom
    enabled: true
    weight: 1.0
    params:
      horizons: [168, 336, 720]
      horizon_weights: [0.2, 0.3, 0.5]
      return_scale: 0.20
      slope_scale: 0.01
      entry_threshold: 0.20
      vol_window: 400
      conviction_mode: sign
      crowding_window: 72
      crowding_cut: 0.7
      crowding_penalty: 0.5
    evidence:                   # k = 0.50, pre-registered 76b996ce
      report: reports/research/tsmom-validation-20261019T090838Z.json
      sha256: c6852bedf3c61ec7bbf92115355104293ea499809292675a9ee0400c30379159
      verdict: WEAK_PASS
    probe:                      # measured at k = 0.50 with the evidence (pre-registration 76b996ce)
      accepted_by: operator
      accepted_on: '2026-10-19'
      reason: >-
        grandfathered main book (KILL-AR-06), copied from config/alpha_registry.yaml on 2026-10-19 for the
        mainnet calibration loop and re-measured at its own k = 0.50.  The stop is the empirical 2.28%
        quantile of the book's own 30-day mark-to-market P&L on the pit panel, and the gate reads that same
        caliber.
      review_after_days: 60
      stop:
        window_days: 30
        max_loss: 0.153
        halts: false
        measured_at:
          population: pit
          quantile_228: -0.152951
          sigma_30d: 0.109682
          windows: 48361
          vol_target: 0.5
          evidence_construction: 4fbc028ea0bfc55e
          registry: 7fdf8af41651
          commit: 76b996ce
          measured: '2026-10-19T09:09:35Z'
