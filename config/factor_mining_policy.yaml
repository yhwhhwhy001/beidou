# BF-11: 因子挖掘 Policy 配置
# 所有阈值必须来自此版本化 policy，禁止在 Python 中硬编码

policy_version: "2.0.0"
policy_name: "factor_mining_default"

# ----------------------------------------------------------
# 候选生成
# ----------------------------------------------------------
generation:
  max_candidates: 10000
  max_complexity_score: 20.0
  random_seed: 42
  generators:
    - template_grid
    - interaction

  template_grid:
    primitives:
      - close
      - log_return
      - volume
      - rsi
      - spread
    windows: [5, 10, 20, 50, 100]
    transforms:
      - identity
      - pct_change
      - zscore
      - diff
    normalizations:
      - none
      - zscore
      - robust_zscore
      - rank
    horizons: [1, 4, 12, 24]

  interaction:
    max_order: 2
    complexity_penalty_per_order: 2.0
    base_factors:
      - momentum
      - mean_reversion
      - volatility
      - liquidity
      - funding
      - basis

# ----------------------------------------------------------
# 快速预筛
# ----------------------------------------------------------
fast_screen:
  min_sample_count: 30
  max_missing_rate: 0.10
  min_variance: 1.0e-12
  max_extreme_ratio: 0.05
  extreme_sigma: 5.0
  max_complexity_score: 20.0
  min_effective_samples: 20
  max_turnover_pct: 50.0

# ----------------------------------------------------------
# Purged Walk-Forward
# ----------------------------------------------------------
walk_forward:
  n_folds: 5
  train_fraction: 0.60
  purge_fraction: 0.05
  embargo_fraction: 0.02
  min_train_samples: 100
  min_test_samples: 20
  min_folds_for_verdict: 3

# ----------------------------------------------------------
# 多重检验
# ----------------------------------------------------------
multiple_testing:
  fdr_alpha: 0.05
  holm_alpha: 0.05
  dsr_sharpe_std: 0.15
  pbo_min_splits: 8
  pbo_threshold: 0.30

# ----------------------------------------------------------
# 成本与容量
# ----------------------------------------------------------
cost:
  taker_fee_bps: 4.0
  maker_fee_bps: 2.0
  avg_spread_bps: 1.0
  slippage_bps: 1.0
  funding_rate_8h_pct: 0.01
  impact_bps_per_10k: 0.1
  stress_multipliers: [1.0, 1.5, 2.0]

# ----------------------------------------------------------
# 稳健性
# ----------------------------------------------------------
stability:
  degradation_threshold: 0.30
  min_samples_per_regime: 10
  parameter_perturbation_pct: 0.10
  n_perturbations: 5

# ----------------------------------------------------------
# 资源限制
# ----------------------------------------------------------
resources:
  time_budget_minutes: 120
  memory_limit_mb: 4096
  checkpoint_interval: 100
