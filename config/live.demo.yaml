profile: demo
venue:
  rest_url: https://demo-fapi.binance.com          # allow-listed demo host; mainnet is refused by beidou_exchange.guard
  # Names of the environment variables holding the credentials (values never live in this repo).
  # These are the operator's existing exports; verified 2026-09-03 against demo-fapi
  # (canTrade=true, one-way mode, flat account).
  api_key_env: BEIDOU_BINANCE_API_KEY
  api_secret_env: BEIDOU_BINANCE_API_SECRET
  recv_window_ms: 10000
market_data:
  rest_url: https://fapi.binance.com               # public, unauthenticated reads only (D-002)
  interval: 1h
  # Lower bound only: the loop requests max(history_bars, min_history_bars + model warmup) closed bars, i.e. 1,442
  # for the weekly tsmom, and refuses to start if that exceeds the 1,500-bar request limit (E-042).
  history_bars: 400
universe: config/universe.yaml
registry: config/alpha_registry.yaml
costs: config/costs.yaml
portfolio:
  leverage: auto              # per-symbol exchange leverage = min(max_leverage, bracket max, ceil(max_gross / margin_cap)) (D-016)
  margin_cap: 0.40            # initial margin at the gross cap stays below 40% of equity (was 100% at a fixed 2x)
  max_leverage: 5
  margin_buffer: 0.10         # keep 10% of the available balance free when scaling risk-adding orders (T-S02)
  max_participation: 0.02     # a risk-adding order <= 2% of the symbol's average hourly quote volume (T-S03)
  vol_target: 0.15            # annualised portfolio volatility target
  max_gross: 2.0              # sum |weight| <= 2.0 (x equity)
  max_weight: 0.15            # |weight| per symbol
  no_trade_band: 0.005        # skip rebalances smaller than 0.5% of equity
  # 2026-09-04 (operator decision, P10 cell B): widened 0.25 -> 0.40.  Two pre-registered rules disagreed on this
  # cell - it passes round 7's R3 rule (OOS >= baseline + 0.05, drawdown worsening <= 1pp, turnover lower) and
  # fails the later P10 rule only on its turnover threshold (-11.8% against -15% required).  The paired test,
  # the same instrument that judged conviction_mode, says this one is not noise: all five walk-forward folds
  # improve, the per-bar OOS return difference has a Newey-West t of 4.18, and a weekly block bootstrap puts the
  # Sharpe difference at +0.142 with a 5-95% interval of [+0.064, +0.218].  Point estimates on the point-in-time
  # universe with the shipped book: OOS Sharpe 1.7347 -> 1.8764, OOS drawdown -12.79% -> -12.90%, turnover
  # 287 -> 253.  Evidence: reports/research/paired-p10-band-20260904T030015Z.json.  Live falsifier: turnover must
  # fall by roughly 12%; if it does not, live and backtest execution semantics have diverged (KILL-027's pattern).
  # Two further checks (this session, reports/research/p10-portfolio-smoothing-20260904.json): the static
  # 14-symbol universe agrees in direction, 1.3771 -> 1.4793 with the same -11.8% turnover and a better
  # drawdown, so this is not one universe's artefact (the check P5 taught us to run); and only 9% of the
  # gain is the saved turnover cost - re-pricing the same weights at zero cost still leaves +0.108 of the
  # +0.142 Sharpe - so this is a timing change from holding through a wider band, not an efficiency saving.
  # That makes it the portfolio-layer twin of conviction_mode sign (D-024: the edge is direction, not
  # magnitude) and, for the same reason, a real behaviour change carrying real selection pressure.
  # Note the layer: tsmom's cited evidence (181803Z) was validated at band 0.25, so the strategy-layer
  # evidence pointer no longer describes the construction; the portfolio-layer evidence is the P10 index
  # above.  The startup gate compares registry params only, so it cannot see this - a known gap.
  no_trade_rel_band: 0.40     # ...or smaller than 40% of the current position (same-direction resizes only)
  min_history_bars: 720       # a symbol needs 30 days of bars before it can be traded
pool:
  # Re-rank once per UTC day with the hysteresis in universe.yaml (D-014); never = static.
  # The research membership table on disk is still MONTHLY (69 refreshes, 146 members), not daily.  An earlier
  # version of this comment claimed it had been rebuilt at the live cadence; it had not, and the audit caught the
  # claim rather than the data.  The measured difference is 2.73% of symbol-bars, and matching it needs hourly
  # history for 63 more symbols plus a re-run of every piece of evidence, so it is carried as a priced residual in
  # the KILL-018 family rather than silently assumed away.  Every validation to date used the monthly table.
  refresh: daily
  candidates: 45              # mainnet 24h-volume shortlist that is re-scored on 30-day volume
  liquidity_window: 24        # bars averaged for the participation cap
exits:                        # bar-close exit overlay in daily-vol units (D-012); 0 disables a rule.
  # `beidou research overlay` 2026-09-03 (tsmom+flow): take_profit 6 sigma_1d is the only setting that meets the D-017
  # rule on BOTH the point-in-time universe (OOS Sharpe 1.55 -> 1.54, OOS MDD -16.7% -> -16.3%) and the static one
  # (1.77 -> 1.73, -10.7% -> -10.4%).  stop_loss 4 + take_profit 6 also qualifies on both (runner-up, -0.05 Sharpe,
  # +0.7pp MDD on pit); every trailing-stop setting hurts on the static universe.  All effects are noise-sized; the
  # overlay is "harmless", not "helpful" - see docs/RESEARCH_LOG.md round 5.
  stop_loss: 0.0
  trailing_stop: 0.0
  take_profit: 6.0
  cooldown_bars: 24
  vol_halflife: 48
drawdown_throttle:            # scale the whole book down between `start` and `stop` drawdown from the equity high-water mark
  # Overlay evidence 2026-09-03: on the point-in-time universe OOS Sharpe 1.55 -> 1.45 (exactly the -0.10 limit) for
  # OOS MDD -16.7% -> -14.8%, and fold 2 (2022-11 -> 2023-11, the recovery) turns negative: the classic whipsaw of a
  # drawdown throttle.  Boundary case, left disabled (D-017).
  enabled: false
  start: 0.05
  stop: 0.20
  floor: 0.25
guards:
  daily_loss_pause: -0.05     # stop adding risk for the rest of the UTC day below -5%
  stale_bars_max: 2           # skip the cycle if the newest closed bar is older than 2 intervals
  # D-025: the host clock is the reference (operator decision).  A constant offset is accepted; what is guarded
  # is how far the wake-up sits from a real bar boundary, and any jump between cycles.
  max_bar_alignment_seconds: 60
  kill_switch_path: .beidou/live/KILL_SWITCH
paths:
  state_dir: .beidou/live
  reports_dir: reports
alerts:
  webhook_url: "${BEIDOU_ALERTS_WEBHOOK_URL:-}"   # expanded from the environment; empty disables
