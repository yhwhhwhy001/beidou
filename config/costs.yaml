# Cost model used by backtests and by the live attribution report.
taker_fee_bps: 5.0        # Binance USDⓈ-M VIP0 taker 0.05%
maker_fee_bps: 2.0
slippage_bps: 2.0         # assumed adverse fill vs next open for market orders
use_actual_funding: true  # backtests charge the historical funding rate on held exposure
# D-034 (2026-09-04): a settlement is charged to the bar that CONTAINS it.  Until that fix the match
# was on an exact timestamp and Binance stamps `fundingTime` 1-47 ms past the hour, so 43.7% of the
# archive was charged as zero.  Every report produced before it under-charges funding by about half.

# 2026-09-08 audit: `cost_stress` scales `turnover_bps` - fee AND slippage - by 1x/1.5x/2x, which
# doubles a contract constant on the way to asking a question about execution.  These are the slippage
# values the book is additionally priced at, fee held fixed at `taker_fee_bps`.  Each has a source:
#   2.0  the model's own assumption (so this block contains its own baseline)
#   5.5  101 filled demo orders, notional-weighted 5.52 bps, mean 5.60 (.beidou/live/trades.jsonl).
#        Measured against the plan price - the reference L1-04 retired - so it is a sensitivity input,
#        not a verdict; M-Q08's own ruler (`decision_close`) had no readings yet on 2026-09-08.
#   9.2  the upper bound of that sample's 95% interval [2.01, 9.19], n=101, demo, over four days.
# Change a number here only with the fill sample that justifies it.
slippage_stress_bps: [2.0, 5.5, 9.2]

# DL-C1 / KILL-A (2026-09-08): the impact model, off by default.
# Everything above charges the same bps for a 40 USDT order and a 4M one, which makes the whole
# backtest scale-free - a property of the arithmetic, not a finding about the world - and is the
# assumption KILL-Q12 has held real capital out of scope on since 2026-09-05.
#   impact_fraction = coefficient * sigma_daily * sqrt(order_notional / ADV)
# `coefficient` is an ASSUMPTION and this system cannot calibrate it.  Its only fills are demo, 54-762
# USDT.  Measured per fill over all 121 of them (2026-09-09, block 4 #42): order/ADV 4.3e-07 median,
# 2.5e-06 max, modelled impact 0.48 bps notional-weighted.  The "around 1e-8 / under a hundredth of a
# basis point" this comment carried until then was DL-C1's pre-run estimate, retracted by DL-C1's own
# run and not propagated here; it understated the reading by two orders of magnitude.  The conclusion
# is unchanged for a different reason: 0.48 bps is inside the [2.01, 9.19] bps interval of the same
# fills' slippage, so impact is not too small to matter but too small to separate from spread.  The
# retraction is left visible rather than overwritten, because the stale figure was quoted back to this
# repo as a premise on 2026-09-09.
# 1.0 is the equities-literature value (Almgren et al., with sigma daily and
# participation as defined above); for this venue it is E5.  Read the OUTPUT as a capacity curve -
# where cost starts to bend with size - not as a prediction of what a fill will cost.
# Change this number only with fills large enough for it to be measurable, which demo cannot produce.
impact:
  coefficient: 1.0
  adv_window_bars: 720   # 30 days hourly
  vol_window_bars: 720
