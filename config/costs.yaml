# Cost model used by backtests and by the live attribution report.
taker_fee_bps: 5.0        # Binance USDⓈ-M VIP0 taker 0.05%
maker_fee_bps: 2.0
slippage_bps: 2.0         # assumed adverse fill vs next open for market orders
use_actual_funding: true  # backtests charge the historical funding rate on held exposure
# D-034 (2026-09-04): a settlement is charged to the bar that CONTAINS it.  Until that fix the match
# was on an exact timestamp and Binance stamps `fundingTime` 1-47 ms past the hour, so 43.7% of the
# archive was charged as zero.  Every report produced before it under-charges funding by about half.

# 2026-09-08 audit: `cost_stress` scales `turnover_bps` - fee AND slippage - by 1x/1.5x/2x, which
# doubles a contract constant on the way to asking a question about execution.  These are the slippage
# values the book is additionally priced at, fee held fixed at `taker_fee_bps`.  Each has a source:
#   2.0  the model's own assumption (so this block contains its own baseline)
#   5.5  101 filled demo orders, notional-weighted 5.52 bps, mean 5.60 (.beidou/live/trades.jsonl).
#        Measured against the plan price - the reference L1-04 retired - so it is a sensitivity input,
#        not a verdict; M-Q08's own ruler (`decision_close`) had no readings yet on 2026-09-08.
#   9.2  the upper bound of that sample's 95% interval [2.01, 9.19], n=101, demo, over four days.
# Change a number here only with the fill sample that justifies it.
#
# 2026-09-17: M-Q08's ruler HAS readings now, and the line above saying it does not is why this is
# recorded rather than left for the next audit to re-find.  `trades.jsonl` has carried
# `decision_close` since that note was written; `scratchpad/decision_close_slippage_measurement.py`
# reads it.  81 filled demo orders, 32,019 USDT:
#       mean +4.89 bps, median +2.96, notional-weighted +4.43, p10/p90 -4.32/+29.40
#       95% CI of the mean [-1.09, +10.87]
# The reference points are made to meet before the numbers are compared, because `slippage_bps` sits
# on top of a fill at the NEXT OPEN while this measures from the decision CLOSE.  The same script
# prices that gap on the same fills (`--with-gap`, n=68): notional-weighted -0.02 bps, i.e. nil here.
#       backtest, from the decision close  ~ +1.98 bps   (gap + slippage_bps 2.0)
#       measured, from the decision close    +4.43 bps   - about 2.2x
#
# `slippage_bps` is NOT changed on this, and the rule one line up is the reason rather than an excuse:
#   * the interval still contains the assumption, so 81 fills cannot reject 2.0 - only stop supporting
#     it comfortably;
#   * `slippage_stress_bps` already prices 2.0 / 5.5 / 9.2, so the measured centre is inside a grid
#     that is already run and `verdict.decide` already reads the x2 cell;
#   * every fill is DEMO.  KILL-Q12 holds real capital out of scope for this class of reason, and the
#     p90/p10 spread (+29.4 vs -4.3) says a minority of orders pay most of the cost - which is where a
#     demo book and a real one differ most.
# What would settle it: more fills, and fills that are not all demo.  Until then the honest state is
# that the assumption is no longer the best estimate and the sample is not good enough to replace it.
#
# 2026-09-17, second note: 4.43 joins the grid, and it is the ONE number above that had no cell of its
# own.  The rule one screen up - "change a number here only with the fill sample that justifies it" -
# is satisfied by the paragraph above rather than waived: 4.43 IS that sample's notional-weighted
# centre, measured from the decision close on the same 81 demo fills.  `slippage_bps` is still 2.0;
# what changes is only that the measured value now gets priced instead of being interpolated between
# 2.0 and 5.5 by whoever reads the report.
#
# Why it mattered enough to add a cell: `cost_stress_gate` (the multiplier grid) put x1 at +0.03 and
# x1.5 at -0.03 against D-028's threshold, so the gate is crossed BETWEEN them and 4.43 lands in that
# interval.  Reading the answer off x1.5 would also have been wrong in a second way - a multiplier
# scales the taker fee too, and 5.0 bps is a contract constant that does not move when execution gets
# worse.  `slippage_stress_gate` prices this grid with the fee held at `taker_fee_bps`.
slippage_stress_bps: [2.0, 4.43, 5.5, 9.2]
#
# 2026-09-19，更正上面那段的读数而不是覆盖它。「x1 at +0.03 and x1.5 at -0.03 ... the gate is
# crossed BETWEEN them」是写那天的读数，今天不成立了：门 `max_sharpe_quantile` 随 N 单调上升，
# 而 N 是 append-only 的 ledger 桶。同一构造三次读数——
#         N     门        x1 margin   x1.5 margin
#       (写那段时)        +0.03       -0.03
#       293   1.5701     +0.0105     -0.0496     (20260917T083033Z)
#       303   1.5733     -0.0106     -0.0709     (20260918T154025Z)
# **x1 自己现在就在门下面**，所以「门在两格之间被穿过」这句话已经不描述今天。
#
# 要紧的是别把这读成滑点变贵了。margin 走负来自两件事，都不是执行：N 从 242 涨到 303 把门抬了，
# 数据窗口延长把 OOS 从 1.5919 挪到 1.5628。滑点档位之间的**相对**影响没变，加 4.43 这一格的理由
# 也就没变——它仍然是实测中心，仍然落在别人会拿来内插的那两格之间。变的是它现在落在门的哪一侧，
# 而那个问题的答案由 N 决定，不由这个文件决定。
#
# 归因不要从这张表自己读：重算只动 N（`governance gate`，日任务，2026-09-19 起），重跑动的是
# N 加数据窗口。两者都真实，不是一回事。

# DL-C1 / KILL-A (2026-09-08): the impact model, off by default.
# Everything above charges the same bps for a 40 USDT order and a 4M one, which makes the whole
# backtest scale-free - a property of the arithmetic, not a finding about the world - and is the
# assumption KILL-Q12 has held real capital out of scope on since 2026-09-05.
#   impact_fraction = coefficient * sigma_daily * sqrt(order_notional / ADV)
# `coefficient` is an ASSUMPTION and this system cannot calibrate it.  Its only fills are demo, 54-762
# USDT.  Measured per fill over all 121 of them (2026-09-09, block 4 #42): order/ADV 4.3e-07 median,
# 2.5e-06 max, modelled impact 0.48 bps notional-weighted.  The "around 1e-8 / under a hundredth of a
# basis point" this comment carried until then was DL-C1's pre-run estimate, retracted by DL-C1's own
# run and not propagated here; it understated the reading by two orders of magnitude.  The conclusion
# is unchanged for a different reason: 0.48 bps is inside the [2.01, 9.19] bps interval of the same
# fills' slippage, so impact is not too small to matter but too small to separate from spread.  The
# retraction is left visible rather than overwritten, because the stale figure was quoted back to this
# repo as a premise on 2026-09-09.
# 1.0 is the equities-literature value (Almgren et al., with sigma daily and
# participation as defined above); for this venue it is E5.  Read the OUTPUT as a capacity curve -
# where cost starts to bend with size - not as a prediction of what a fill will cost.
# Change this number only with fills large enough for it to be measurable, which demo cannot produce.
impact:
  coefficient: 1.0
  adv_window_bars: 720   # 30 days hourly
  vol_window_bars: 720
