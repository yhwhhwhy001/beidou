# Strategies the live loop is allowed to run.  A strategy may only be enabled
# when `evidence` points at a validation report produced by `beidou research validate`
# and its sha256 matches; `beidou live run` verifies this at startup (KILL-015).
version: 1
ensemble:
  method: mean                 # weighted mean of per-strategy targets (alternative: rolling_zscore)
  turnover_penalty: 0.0
books:                         # independent sleeves next to the main book (D-018/D-019): each book is vol-targeted
  flow_short:                  # on its own, scaled by `fraction`, summed with the main book; the main caps/band then apply
    fraction: 0.333333         # must equal the `fraction` of the cited book report (checked at startup)
strategies:
  - id: tsmom
    enabled: true
    weight: 1.0
    # Weekly-scale horizons: validated 2026-09-03 on 15 symbols, 2021-07 -> 2026-09
    # (walk-forward OOS Sharpe 1.38, CPCV q05 1.20, DSR p 0.045, PBO 0.04, cost x2 Sharpe 1.29).
    # The legacy 5/20/50-hour horizons FAILED validation (see docs/RESEARCH_LOG.md).
    # 2026-09-03 round 4 enabled a funding-crowding modifier (crowding_window 72 / cut 0.7 / penalty 0.5) on the
    # static-universe evidence (OOS 1.61 vs 1.38).  Round 6 (2026-09-04) DISABLED it (KILL-027 / E-040 / E-041):
    # the live path never had funding history, so the modifier was silently inactive while the registry evidence
    # claimed it, and on the point-in-time universe the modifier is a negative contribution (full-sample Sharpe
    # 1.64 with vs 1.72 without).  What runs is now exactly what is validated; re-open only with funding wired into
    # the live panel AND a pre-registered point-in-time walk-forward against this control.
    params:
      horizons: [168, 336, 720]
      horizon_weights: [0.2, 0.3, 0.5]
      return_scale: 0.20
      slope_scale: 0.01
      entry_threshold: 0.20
      # Measured inert under conviction_mode sign: 400 / 100 / expanding give the SAME sign on every one of
      # 4,668,384 symbol-bars, because the clip against return_scale always binds (E-043).  Kept rather than
      # deleted: omitting it falls back to the dataclass default of 200, which would no longer equal the cited
      # evidence and the startup params gate would refuse to start.
      vol_window: 400
      conviction_mode: sign     # H-001: trade the direction of the weekly signal, not its magnitude (adopted 2026-09-04)
      crowding_window: 0        # modifier off (the cut/penalty below are inert; kept so the params equal the report's best_params).
                                # NOTE: this is now an evidence question, not a plumbing one.  Round 6b (D-023) wired
                                # funding history into the live panel and made a signal declare its need, so a
                                # funding-consuming setting (crowding_window > 0, or carry) is no longer silently
                                # skipped - startup refuses it instead.  Re-enabling still needs its own point-in-time
                                # re-validation under D-020: on this evidence the modifier is a small negative
                                # (OOS 1.53 with vs 1.65 without).  A running loop only picks up the plumbing after
                                # a restart; see docs/RUNBOOK.md.
      crowding_cut: 0.7
      crowding_penalty: 0.5
    # 2026-09-03 round 5: re-validated on the point-in-time universe (146 symbols that were ever top-15 by 30-day
    # volume, monthly re-selection with the live hysteresis; D-013).  Survivorship-free result is unchanged:
    # walk-forward OOS Sharpe 1.53 (static 1.52), folds [1.22, 0.78, 2.04, 1.65, 1.94], CPCV q05 1.18, DSR p 0.0002
    # at 49 trials, cost x2 Sharpe 1.35, full-sample 1.64 / MDD -12.6%.
    # 2026-09-04 D-020 (operator decision; docs/RESEARCH_LOG.md): the verdict is OOS-first and the DSR is informational.
    # Evidence re-run as the crowding-off vs crowding-on control experiment on the point-in-time universe (same numbers
    # as beidou-45's 175236Z): full-sample Sharpe 1.72 / MDD -13.5%, walk-forward OOS Sharpe 1.55 with Newey-West t 3.5
    # over 44,995 OOS bars, folds [1.22, 0.49, 2.04, 1.65, 2.31], CPCV 1.65 / q05 1.26 / 0% negative, cost x2 1.43;
    # The headline 1.55 is the fold-selected mixture (per-fold crowding_window [72, 0, 72, 72, 0]); the configuration
    # that actually runs here (crowding off) has its own OOS Sharpe 1.65, t 3.73, folds [1.47, 0.49, 2.24, 1.71, 2.31]
    # - the mixture is the conservative number, and best_params still equal these params.
    # DSR p 0.26 at 69 trials (reported, not a veto), PBO 0.55 at N=2 (informational).  The 133239Z report (crowding
    # 0.5, DSR p 0.0002 from a degenerate pooled variance) is superseded; the modifier never ran live (E-040).
    # 2026-09-04 H-001 (operator decision): `conviction_mode: sign` adopted.  Pre-registered rule, fixed before the
    # run: adopt only if OOS Sharpe >= baseline - 0.05 AND OOS max drawdown improves AND turnover falls.  All three
    # hold (OOS 1.6450 -> 1.6026, MDD -13.53% -> -11.75%, turnover 357.4 -> 263.8, cost share 14.57% -> 11.69%).
    # The honest reading is not "better" but "magnitude carries no return information": the two OOS net-return
    # streams correlate 0.966 and their per-bar difference has a Newey-West t of -0.047 (p 0.96); a weekly block
    # bootstrap puts the Sharpe difference at [-0.238, +0.151].  What is bought is lower turnover and a shallower
    # drawdown; what is paid is a coarser position grain (average absolute exposure 0.383 -> 0.445).
    # Evidence below is the single-configuration report (grid 1) because `validate` picks best_params by full-sample
    # Sharpe, which the baseline wins; under D-020 the sign arm passes on its own: OOS 1.6026, Newey-West t 3.686,
    # five folds positive, CPCV q05 1.23, 0% negative paths, cost x2 1.47.  Live arbiter: M-010 income attribution
    # over 30 days, plus a turnover check - if turnover does not fall by roughly a quarter, live and backtest
    # execution semantics have diverged again (that is how KILL-027 was found).
    # 2026-09-04 05:22Z: re-validated again after the research membership moved from MONTHLY to DAILY
    # re-selection (operator decision), which is the cadence the live pool has always used - the backtest now
    # trades the universe the loop would actually have held.  The rebuild replaced membership.parquet, so every
    # earlier `--universe pit` number became unreproducible; 041838Z below is kept for the band comparison but
    # is no longer the evidence.  Same single-configuration protocol: OOS Sharpe 1.6436 against 1.7140 on the
    # monthly table, Newey-West t 3.77, folds [1.47, 0.78, 2.32, 1.05, 2.58], consistency 1.00, CPCV 1.72
    # / q05 1.41 / 0% negative, cost x2 1.54, full sample 1.7160 / MDD -12.1%,
    # turnover 226.  204 symbols ever in the pool against 146 monthly, 0.36 membership changes
    # per daily refresh against 6.68 per monthly one.  The strategy survives the higher-churn, more honest
    # universe at a cost of 0.07 OOS Sharpe, which is the size of the survivorship-adjacent bias the
    # monthly cadence was carrying.  DSR p 0.26 reported, not a veto (D-020).
    # 2026-09-04 04:18Z: re-validated under the ADOPTED construction (no_trade_rel_band 0.40, P10 cell B).  The
    # previous pointer (020459Z) was measured at band 0.25, so after the adoption the strategy-layer evidence no
    # longer described the construction that runs - the D-026 gap, closed by re-running rather than by noting it.
    # Same protocol as 020459Z (single configuration, point-in-time universe, 30 declared pre-ledger trials), so the
    # two are like for like: walk-forward OOS Sharpe 1.7140 against 1.6026 at band 0.25, Newey-West t
    # 3.95 over 44,995 OOS bars, folds [1.29, 0.63, 2.7, 1.58, 2.35], consistency 1.00,
    # CPCV 1.80 / q05 1.37 / 0% negative, cost x2 1.62, full sample 1.7949
    # / MDD -12.1%.  Turnover 233 against 264 and cost share 9.7% against 11.7%: the
    # adoption's effect shows up in the evidence pipeline, not only in the paired test that justified it.
    # DSR p 0.19 is reported, not a veto (D-020).
    # The harder test also passes: the default 16-point grid at this band (040252Z, n=87 trials) gives OOS 1.376 with
    # t 3.13 and PBO 0.015, and its full-sample best_params equal the params above.  Its headline is lower because
    # folds 0-2 select entry_threshold/return_scale 0.3 there; a fold-selected mixture is not this configuration.
    evidence:
      report: reports/research/tsmom-validation-20260904T052215Z.json
      sha256: 0d84c3decab08202d76f6402ec9d06e832dd6a1e128047e32fa22fbe9e5f5244
      verdict: PASS
  - id: xsmom
    enabled: false
    weight: 1.0
    # Best honest configuration so far (raw returns, no skip): WFO OOS Sharpe 0.72, CPCV 0.70/-0.01, PBO 0.05,
    # but DSR p 0.12 with 4 trials and far worse once the ~26 cumulative xsmom trials are charged. Stays disabled.
    # Risk-adjusted / skip-24 variants validated worse in the full pipeline (OOS 0.20 / 0.51). See docs/RESEARCH_LOG.md.
    params: {horizons: [168, 336, 720], horizon_weights: [0.2, 0.3, 0.5], skip_bars: 0, risk_adjusted: false, score_scale: 0.15, entry_threshold: 0.30}
    evidence: null
  - id: carry
    enabled: false
    weight: 1.0
    params: {window_bars: 72, mode: rank, entry_threshold: 0.20}
    evidence: null
  - id: meanrev
    enabled: false
    weight: 1.0
    params: {window: 48, z_entry: 1.5, z_exit: 0.5, z_max: 5.0, trend_gate_z: 2.0, entry_threshold: 0.20}
    evidence: null
  - id: breakout
    enabled: false
    weight: 1.0
    params: {window: 48, atr_window: 14, distance_scale: 2.0, entry_threshold: 0.20}
    evidence: null
  - id: flow
    # ENABLED AS A PROBE BOOK 2026-09-03 (D-019, operator decision: docs/RESEARCH_LOG.md round 5, path (b)).
    # The short-only sleeve runs at a 1/3 risk budget next to tsmom.  The pre-registered book rule (D-018) says
    # ACCEPT (total OOS Sharpe 1.53 -> 1.68, 4/5 folds, OOS MDD +0.7pp) while the sleeve's own validation verdict is
    # FAIL (DSR p 0.81 at 48 trials), it is worth nothing on the static universe and 91% of its positions stack on
    # tsmom's shorts.  So this is a bounded demo experiment that exists to earn out-of-sample evidence, not a
    # validated strategy: `probe.stop` closes the book automatically when its trailing 30-day attributed P&L is
    # <= -1% of equity (about -2 sigma of the sleeve's 30-day P&L; a literal "negative P&L stops" rule would stop a
    # Sharpe-1 sleeve ~37% of the time in its first month), `review_after_days` flags the review date (2026-12-02)
    # in the daily report, and `beidou live run` refuses an ACCEPT verdict without this probe block (KILL-015).
    enabled: true
    book: flow_short
    weight: 1.0
    # History.  Round 5 (KILL-025): on the point-in-time universe (D-013) flow FAILS - walk-forward OOS
    # Sharpe 0.58, folds [-0.40, -0.04, 1.50, 1.13, 0.79], CPCV q05 -0.55, DSR p 0.56 (44 trials).  The static-universe
    # PASS below (OOS 1.40 / 1.75) was survivorship: the long leg earned +148% on the 15 survivors and +20% (Sharpe
    # 0.26) on the names that were actually top-15 at the time; the ranking IC is identical in both universes.  Three
    # pre-registered rescues all FAIL on pit: short-only (OOS 1.09, DSR p 0.26 at 46 trials), tenure >= 12 refreshes
    # (0.31), short-only + tenure (0.08).  Re-open only with new evidence on the pit universe.
    # 2026-09-03 14:36Z (D-018, `research book`): short-only flow as a 1/3-budget sleeve next to tsmom on pit lifts the
    # total book's OOS Sharpe 1.53 -> 1.68 (4/5 folds, MDD +0.7pp) and the pre-registered book rule says ACCEPT, but the
    # sleeve itself FAILS (DSR p 0.81 at 48 trials), is worth nothing on the static universe (Sharpe 0.23) and 91% of its
    # positions are names tsmom is already short (a short-side tilt, not an independent book).  Stays disabled.
    # Round 2 (2026-09-03 06:27Z): 4-point prior grid, walk-forward OOS Sharpe 1.07 with one negative fold.
    # Round 5 (2026-09-03 09:27Z): the losing stretch (2024-10 -> 2025-09, -8.6% in 2024-11 alone) was the SHORT leg
    # being squeezed in spot-led rallies (XRP/ADA/SUI); perp taker selling into a strong uptrend is hedging, not
    # information.  `short_gate` drops shorts while weekly momentum >= 0.3 (longs are never gated: the symmetric gate
    # destroyed the 2022 bear folds).  Grid {short_gate: [0, 0.3, 0.5]} with 39 pre-ledger flow trials charged
    # (28 earlier rounds + 11 round-5 diagnostics): walk-forward OOS Sharpe 1.40, every fold positive and no fold chose
    # the un-gated control, CPCV mean 1.66 / q05 1.29 / 0% negative, DSR p 0.007 at 42 trials, cost x2 Sharpe 1.58,
    # full-sample MDD -12% (was -26%).  PBO 0.57 is informational at N=3.  See docs/RESEARCH_LOG.md round 5.
    params:
      window: 168
      scale: 0.05
      volume_window: 48
      cross_sectional: true
      entry_threshold: 0.20
      short_gate: 0.3
      long_side: false          # short-only: the long leg's static-universe evidence was survivorship (KILL-025)
      gate_horizons: [168, 336, 720]
      gate_weights: [0.2, 0.3, 0.5]
      gate_return_scale: 0.20
      gate_vol_window: 400
    evidence:
      report: reports/research/book-tsmom-flow-20260903T143621Z.json
      sha256: 80a08f897daa4640bd9f2e4e9197801efad7dc4052ef094ddbbce7ac9f7d642b
      verdict: ACCEPT           # book-level (D-018); the sleeve's standalone verdict inside the report is FAIL
    probe:
      accepted_by: operator
      accepted_on: "2026-09-03"
      reason: bounded demo experiment to earn out-of-sample evidence for the short-only flow sleeve (D-019)
      stop: {window_days: 30, max_loss: 0.01}
      review_after_days: 90
  - id: residual
    enabled: false
    weight: 1.0
    params: {horizons: [24, 72, 168], beta_window: 336, scale: 0.05, benchmark: BTCUSDT, entry_threshold: 0.20}
    evidence: null
