#
# 这份名单读自 .beidou/live/state.json——armed 循环此刻真正持有的那套。第一版读的是
# .beidou/data/universe.json，而 09-08 18:00Z 一次裸 --paper 重排把那个文件里的 CYSUSDT
# 换成了 PUMPUSDT；照那份钉，钉的是循环从来没持有过的币。文件是观察，而且不止一个进程在写它。
