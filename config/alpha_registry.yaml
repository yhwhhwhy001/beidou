# 钉住造成的，池子每天换手时低权重的币会随排名自然出池。可证伪判据：若任一标的连续 5 天记
# BAND_BLOCKS_ENTRY 且没被重排踢出池子，这条说法即被证伪，届时重议。
#
# 生效同样要重启——引擎只在启动时建模。取消后 registry_digest 不再含 universe 键（条件化的），
# 所以 digest 会变一次；重启后心跳应读到新值。
# 设计：docs/analysis/2026-09-15-universe-unpin-and-dataset-gate-design.md
universe: []
ensemble:
  method: mean                 # weighted mean of per-strategy targets (alternative: rolling_zscore)
  turnover_penalty: 0.0
books:                         # independent sleeves next to the main book (D-018/D-019): each book is vol-targeted
  flow_short:                  # on its own, scaled by `fraction`, summed with the main book; the main caps/band then apply
    fraction: 0.333333         # must equal the `fraction` of the cited book report (checked at startup)
strategies:
  - id: tsmom
    enabled: true
    weight: 1.0
    # Weekly-scale horizons: validated 2026-09-03 on 15 symbols, 2021-07 -> 2026-09
    # (walk-forward OOS Sharpe 1.38, CPCV q05 1.20, DSR p 0.045, PBO 0.04, cost x2 Sharpe 1.29).
    # The legacy 5/20/50-hour horizons FAILED validation (see docs/RESEARCH_LOG.md).
    # 2026-09-03 round 4 enabled a funding-crowding modifier (crowding_window 72 / cut 0.7 / penalty 0.5) on the
    # static-universe evidence (OOS 1.61 vs 1.38).  Round 6 (2026-09-04) DISABLED it (KILL-027 / E-040 / E-041):
    # the live path never had funding history, so the modifier was silently inactive while the registry evidence
    # claimed it, and on the point-in-time universe the modifier is a negative contribution (full-sample Sharpe
    # 1.64 with vs 1.72 without).  What runs is now exactly what is validated; re-open only with funding wired into
    # the live panel AND a pre-registered point-in-time walk-forward against this control.
    # 2026-09-05 RE-ENABLED, and the reason the round-6 rejection did not survive re-examination.  That
    # rejection cited "on this evidence the modifier is a small negative (OOS 1.53 with vs 1.65 without)",
    # which is tsmom-validation-20260903T181803Z, run 09-03 18:18.  D-034 (b0cc08a) landed 09-04 20:44:
    # `fundingTime` lands one to forty-seven milliseconds past the hour and unevenly by year, so matching a
    # settlement to a bar open by equality had dropped 43.7% of the 441,678-row archive onto a silent zero,
    # "and the share missing differed from fold to fold".  This modifier reads exactly one thing - the trailing
    # CROSS-SECTIONAL rank of funding - so 181803Z ranked a panel missing 43.7% of its settlements.  552ca9a
    # re-ran the evidence under the corrected funding the same evening but added ONE ledger row
    # (crowding_window=0): only the control arm was re-scored, so the comparison itself was never redone.
    # Redone 2026-09-05 as a registered two-arm run, 193707Z.  That run is itself superseded: the evidence
    # block below points at 093705Z (2026-09-06), which re-ran the same protocol under the corrected
    # cross-sectional reference population; the P1-01 paragraph further down carries that run's numbers,
    # and PBO is the figure below that moves most under it - 0.136 -> 0.219, informational at N=2 either way.
    # 193707Z's numbers are kept here because what they are for is the argument against 181803Z, which is
    # this paragraph's subject: all five folds select the modifier, OOS 1.7647 / NW t 4.0266, consistency
    # 1.00, CPCV 1.795 / q05 1.338 / 0% negative, cost x2 1.68, PBO 0.136 - against 181803Z's PBO 0.5484,
    # which fails D-020's own hard gate.  The PBO collapse is the tell: a corrupted input destabilises
    # per-fold selection, and PBO is what measures that.
    # Recorded honestly: this is a 2-point grid, so PBO at N=2 stays informational by our own convention, and
    # D-020's two PASS conditions are not independent over a 5-year window (RESEARCH_LOG:344) - the verdict
    # rests on one Sharpe gate plus three hard gates, not on two independent tests.
    # Found by the external audit in docs/analysis/2026-09-05-backtest-guard-external-audit.md; the ledger-free
    # recomputation that first caught it is scratchpad/verify_crowding_arms.py and agrees to the digit.
    params:
      horizons: [168, 336, 720]
      horizon_weights: [0.2, 0.3, 0.5]
      return_scale: 0.20
      slope_scale: 0.01
      entry_threshold: 0.20
      # Measured inert under conviction_mode sign: 400 / 100 / expanding give the SAME sign on every one of
      # 4,668,384 symbol-bars, because the clip against return_scale always binds (E-043).  Kept rather than
      # deleted: omitting it falls back to the dataclass default of 200, which would no longer equal the cited
      # evidence and the startup params gate would refuse to start.
      vol_window: 400
      conviction_mode: sign     # H-001: trade the direction of the weekly signal, not its magnitude (adopted 2026-09-04)
      crowding_window: 72       # modifier ON (re-enabled 2026-09-05; see the D-034 paragraph below).
                                # It consumes funding, so `SignalSpec.needs_funding` is now true for tsmom: a live
                                # panel without `funding_history` makes `AlphaModel.targets` raise and
                                # `beidou live run` refuse to start, rather than running the modifier silently
                                # inactive as it did before D-023 (that failure mode is E-040 / KILL-027).
                                # A RUNNING LOOP ONLY PICKS THIS UP AFTER A RESTART; see docs/RUNBOOK.md.
      crowding_cut: 0.7
      crowding_penalty: 0.5
    # 2026-09-03 round 5: re-validated on the point-in-time universe (146 symbols that were ever top-15 by 30-day
    # volume, monthly re-selection with the live hysteresis; D-013).  Survivorship-free result is unchanged:
    # walk-forward OOS Sharpe 1.53 (static 1.52), folds [1.22, 0.78, 2.04, 1.65, 1.94], CPCV q05 1.18, DSR p 0.0002
    # at 49 trials, cost x2 Sharpe 1.35, full-sample 1.64 / MDD -12.6%.
    # 2026-09-04 D-020 (operator decision; docs/RESEARCH_LOG.md): the verdict is OOS-first and the DSR is informational.
    # Evidence re-run as the crowding-off vs crowding-on control experiment on the point-in-time universe (same numbers
    # as beidou-45's 175236Z): full-sample Sharpe 1.72 / MDD -13.5%, walk-forward OOS Sharpe 1.55 with Newey-West t 3.5
    # over 44,995 OOS bars, folds [1.22, 0.49, 2.04, 1.65, 2.31], CPCV 1.65 / q05 1.26 / 0% negative, cost x2 1.43;
    # The headline 1.55 is the fold-selected mixture (per-fold crowding_window [72, 0, 72, 72, 0]); the configuration
    # that actually runs here (crowding off) has its own OOS Sharpe 1.65, t 3.73, folds [1.47, 0.49, 2.24, 1.71, 2.31]
    # - the mixture is the conservative number, and best_params still equal these params.
    # DSR p 0.26 at 69 trials (reported, not a veto), PBO 0.55 at N=2 (informational).  The 133239Z report (crowding
    # 0.5, DSR p 0.0002 from a degenerate pooled variance) is superseded; the modifier never ran live (E-040).
    # 2026-09-04 H-001 (operator decision): `conviction_mode: sign` adopted.  Pre-registered rule, fixed before the
    # run: adopt only if OOS Sharpe >= baseline - 0.05 AND OOS max drawdown improves AND turnover falls.  All three
    # hold (OOS 1.6450 -> 1.6026, MDD -13.53% -> -11.75%, turnover 357.4 -> 263.8, cost share 14.57% -> 11.69%).
    # The honest reading is not "better" but "magnitude carries no return information": the two OOS net-return
    # streams correlate 0.966 and their per-bar difference has a Newey-West t of -0.047 (p 0.96); a weekly block
    # bootstrap puts the Sharpe difference at [-0.238, +0.151].  What is bought is lower turnover and a shallower
    # drawdown; what is paid is a coarser position grain (average absolute exposure 0.383 -> 0.445).
    # Evidence below is the single-configuration report (grid 1) because `validate` picks best_params by full-sample
    # Sharpe, which the baseline wins; under D-020 the sign arm passes on its own: OOS 1.6026, Newey-West t 3.686,
    # five folds positive, CPCV q05 1.23, 0% negative paths, cost x2 1.47.  Live arbiter: M-010 income attribution
    # over 30 days, plus a turnover check - if turnover does not fall by roughly a quarter, live and backtest
    # execution semantics have diverged again (that is how KILL-027 was found).
    # 2026-09-04 05:22Z: re-validated again after the research membership moved from MONTHLY to DAILY
    # re-selection (operator decision), which is the cadence the live pool has always used - the backtest now
    # trades the universe the loop would actually have held.  The rebuild replaced membership.parquet, so every
    # earlier `--universe pit` number became unreproducible; 041838Z below is kept for the band comparison but
    # is no longer the evidence.  Same single-configuration protocol: OOS Sharpe 1.6436 against 1.7140 on the
    # monthly table, Newey-West t 3.77, folds [1.47, 0.78, 2.32, 1.05, 2.58], consistency 1.00, CPCV 1.72
    # / q05 1.41 / 0% negative, cost x2 1.54, full sample 1.7160 / MDD -12.1%,
    # turnover 226.  204 symbols ever in the pool against 146 monthly, 0.36 membership changes
    # per daily refresh against 6.68 per monthly one.  The strategy survives the higher-churn, more honest
    # universe at a cost of 0.07 OOS Sharpe, which is the size of the survivorship-adjacent bias the
    # monthly cadence was carrying.  DSR p 0.26 reported, not a veto (D-020).
    # 2026-09-04 04:18Z: re-validated under the ADOPTED construction (no_trade_rel_band 0.40, P10 cell B).  The
    # previous pointer (020459Z) was measured at band 0.25, so after the adoption the strategy-layer evidence no
    # longer described the construction that runs - the D-026 gap, closed by re-running rather than by noting it.
    # Same protocol as 020459Z (single configuration, point-in-time universe, 30 declared pre-ledger trials), so the
    # two are like for like: walk-forward OOS Sharpe 1.7140 against 1.6026 at band 0.25, Newey-West t
    # 3.95 over 44,995 OOS bars, folds [1.29, 0.63, 2.7, 1.58, 2.35], consistency 1.00,
    # CPCV 1.80 / q05 1.37 / 0% negative, cost x2 1.62, full sample 1.7949
    # / MDD -12.1%.  Turnover 233 against 264 and cost share 9.7% against 11.7%: the
    # adoption's effect shows up in the evidence pipeline, not only in the paired test that justified it.
    # DSR p 0.19 is reported, not a veto (D-020).
    # The harder test also passes: the default 16-point grid at this band (040252Z, n=87 trials) gives OOS 1.376 with
    # t 3.13 and PBO 0.015, and its full-sample best_params equal the params above.  Its headline is lower because
    # folds 0-2 select entry_threshold/return_scale 0.3 there; a fold-selected mixture is not this configuration.
    # 2026-09-04 13:14Z: RE-RUN under the corrected funding alignment (D-034).  The 052215Z report cited here
    # before was computed while 43.7% of settled funding was being dropped by an exact-timestamp match, so it
    # under-charged the funding this book pays.  Same protocol, so the two are like for like: pit universe,
    # single configuration, 5 folds, min_train 4000, purge 50, cpcv 6, 30 declared pre-ledger trials.
    # Verdict is unchanged - PASS with no failing gate - and the strategy-layer numbers move as follows:
    # walk-forward OOS Sharpe 1.6436 -> 1.6496 with Newey-West t 3.78 over 45,014 OOS bars, folds
    # [1.42, 0.79, 2.33, 1.07, 2.63], consistency 1.00, CPCV 1.6984 / q05 1.3889 / 0% negative,
    # cost x2 1.5234, full sample 1.6972 / MDD -11.90%, turnover 225.6, cost share of gross 9.28% -> 9.78%.
    # DSR p 0.2852 at 91 trials, reported not a veto (D-020); OOS clears the D-028 deflated threshold 1.0972.
    # The full-sample move of -0.0188 is decomposed rather than asserted (2x2 diagnostic, no trials spent,
    # `research validate` run once): funding fix -0.0083, CYSUSDT entering the pit universe -0.0096, two
    # extra bars -0.0010.  The control cell reproduces the superseded report to 0.0010, which is what makes
    # the decomposition trustworthy.  CYSUSDT is the name the pool comment already flagged as traded live
    # while research had no klines for it; `beidou data sync` has since filled it in, so the pit universe is
    # 205 symbols against 204.  Note the ledger charged the superseded run as a distinct trial (90 -> 91)
    # because its range end differs by two bars, so the open question of whether a re-run after a data
    # correction is the same trial did not have to be answered here - it was charged the conservative way.
    # 2026-09-04 14:53Z: re-validated under the ADOPTED construction (P13, `vol_target` 0.15 -> 0.30).  The
    # 131421Z pointer was measured at 0.15, so after the adoption the strategy-layer evidence no longer
    # described the construction that runs - the same D-026 situation as the P10 band above, closed the same
    # way, by re-running rather than by noting it.  The startup gate would have refused to start otherwise,
    # which is `construction_problems` doing exactly its job; it caught this before the restart did.
    # Same protocol, so the two are like for like: pit universe, single configuration (`conviction_mode: sign`),
    # 5 folds, min_train 4000, purge 50, cpcv 6, 30 declared pre-ledger trials.  Verdict unchanged - PASS with
    # no failing gate - and the numbers barely move, which is the point rather than a surprise: the vol target
    # is a scalar on the weights, so it cancels out of a Sharpe except through the caps and the two guards.
    # Walk-forward OOS Sharpe 1.6496 -> 1.66 with consistency 1.00, CPCV 1.71 / q05 1.35 / 0% negative,
    # cost x2 1.55.  DSR p 0.28 at 91 trials, reported not a veto (D-020); OOS clears the D-028 threshold 1.10.
    # The ledger was charged one trial for this run.  What DID move is what the report now records: its
    # `portfolio` block reads vol_target 0.30, so from here the gate compares a construction that is real.
    # 2026-09-08 audit - what the stress testing covers, declared rather than left to be assumed.
    # The hourly archive starts 2021-01-01 and the first scored decision bar is 2021-01-31 01:00Z, so the
    # book has been replayed through 2021-05 (leverage flush), 2022-05 (LUNA/UST), 2022-06 (3AC/Celsius),
    # 2022-11 (FTX) and 2024-08 (yen carry unwind) - four positive, one small negative (FTX -3.3%), every
    # one of them far better than the equal-weight long benchmark, which is the crisis-alpha shape the
    # edge statement in signals/tsmom.py predicts.  It has NOT been replayed through 2020-03: that data
    # does not exist for this universe and the 2020 perpetual roster barely overlaps today's, so the gap
    # is declared rather than filled.  It matters because 2020-03 is the one event whose timescale was
    # minutes, and all three of this book's protections are per-bar - `daily_loss_pause` acts on the next
    # cycle, `max_participation` shrinks with the same volume curve that dries up, and the exit overlay
    # only evaluates at a close.  Measurements: scratchpad/audit20260908_stress_windows.py.
    # Return shape over the whole sample, for the "is this short volatility wearing a hat" question:
    # hourly skew +1.08 / daily +0.83 (positive, i.e. the opposite sign), hit rate 51%/53%, payoff ratio
    # 1.02/1.16, worst UTC day -6.22%.  The hypothesis is refuted by measurement, not by argument.
    # 2026-09-06 P1-01/DL-Q1: re-validated under the corrected CROSS-SECTIONAL REFERENCE POPULATION.
    # The crowding modifier ranks trailing funding across symbols, and until now "across symbols" meant
    # whichever columns the caller had loaded: research ranked a name against the whole point-in-time
    # panel (118.8 names on an average bar), the loop against the 15-18 it manages.  Measured on the
    # shipped configuration, that is not a rounding difference - on member symbol-bars the long-crowding
    # flag fires on 10.60% of them under the panel-wide population and 17.28% under the members-only one,
    # and only 52% of the new flags are bars the old population also flagged.  So 193707Z described a
    # signal the loop was not running; this report describes the one it is.
    # Same protocol as 193707Z, so the two are like for like: pit universe, two-arm grid
    # {crowding_window: [0, 72]}, 5 folds, min_train 4000, purge 50, cpcv 6.  Verdict unchanged - PASS,
    # no failing gate - and all five folds still select the modifier:
    #   walk-forward OOS 1.7647 -> 1.7662, NW t 4.03 -> 4.06, consistency 1.00, folds
    #   [1.63, 0.90, 2.59, 1.10, 2.56] -> [1.74, 0.60, 2.56, 1.32, 2.56]
    #   full sample 1.8261 -> 1.8177, MDD -22.19% -> -23.68%, turnover 384 -> 375
    #   CPCV 1.795 -> 1.794, q05 1.338 -> 1.418, 0% negative;  cost x2 1.676 -> 1.672
    #   arms: cw 0 1.7035 -> 1.7097, cw 72 1.8261 -> 1.8177 (the modifier's edge survives the correction)
    #   PBO 0.136 -> 0.219 (informational at N=2 by our own convention)
    # The D-028 threshold moves 1.0981 @ 93 trials -> 1.1446 @ 125, because --prior-trials went 30 -> 60:
    # 30 as before, +14 for D-039's hand-declared band cells, +16 for the 2026-09-06 grid run recorded in
    # docs/analysis/2026-09-05-system-quality-deep-analysis.md.  Declared rather than left to be noticed.
    #
    # 2026-09-06 DL-R4: what this report is NOT.  Its walk-forward OOS of 1.7662 comes from a two-arm
