# Strategies the live loop is allowed to run.  A strategy may only be enabled
# when `evidence` points at a validation report produced by `beidou research validate`
# and its sha256 matches; `beidou live run` verifies this at startup (KILL-015).
version: 1
ensemble:
  method: mean                 # weighted mean of per-strategy targets (alternative: rolling_zscore)
  turnover_penalty: 0.0
strategies:
  - id: tsmom
    enabled: true
    weight: 1.0
    # Weekly-scale horizons: validated 2026-09-03 on 15 symbols, 2021-07 -> 2026-09
    # (walk-forward OOS Sharpe 1.38, CPCV q05 1.20, DSR p 0.045, PBO 0.04, cost x2 Sharpe 1.29).
    # The legacy 5/20/50-hour horizons FAILED validation (see docs/RESEARCH_LOG.md).
    params:
      horizons: [168, 336, 720]
      horizon_weights: [0.2, 0.3, 0.5]
      return_scale: 0.20
      slope_scale: 0.01
      entry_threshold: 0.20
      vol_window: 400
    evidence:
      report: reports/research/tsmom-validation-20260903T0619Z.json
      sha256: 0233cc7bfa8db4d7d8cf82865d0a2a62799b38c25ae7dc3dd9a262e18a9cb6f7
      verdict: PASS
  - id: xsmom
    enabled: false
    weight: 1.0
    params: {horizons: [24, 72, 168], horizon_weights: [0.2, 0.3, 0.5], score_scale: 0.08, entry_threshold: 0.20}
    evidence: null
  - id: carry
    enabled: false
    weight: 1.0
    params: {window_bars: 24, scale: 0.0005, cross_sectional: true, entry_threshold: 0.20}
    evidence: null
  - id: meanrev
    enabled: false
    weight: 1.0
    params: {window: 48, z_entry: 1.5, z_exit: 0.5, z_max: 5.0, trend_gate_z: 2.0, entry_threshold: 0.20}
    evidence: null
  - id: breakout
    enabled: false
    weight: 1.0
    params: {window: 48, atr_window: 14, distance_scale: 2.0, entry_threshold: 0.20}
    evidence: null
  - id: flow
    enabled: true
    weight: 1.0
    # Validated 2026-09-03 with a 4-point prior grid on 15 symbols, 2021-07 -> 2026-09
    # (walk-forward OOS Sharpe 1.07, CPCV mean 1.16 / q05 0.24, DSR p 0.048, PBO 0.27, cost x2 Sharpe 1.04).
    # Weak spot: one negative walk-forward fold (-0.81); watch drift.
    params: {window: 168, scale: 0.05, volume_window: 48, cross_sectional: true, entry_threshold: 0.20}
    evidence:
      report: reports/research/flow-validation-20260903T0627Z.json
      sha256: 46f0c416524b41c146f7ee1e1957ff0b09a5fad3239bf7d7fb4ba112ece04aeb
      verdict: PASS
  - id: residual
    enabled: false
    weight: 1.0
    params: {horizons: [24, 72, 168], beta_window: 336, scale: 0.05, benchmark: BTCUSDT, entry_threshold: 0.20}
    evidence: null
