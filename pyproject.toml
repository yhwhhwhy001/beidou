[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "beidou_shared",
    "beidou_data",
    "beidou_alpha",
    "beidou_exchange",
    "beidou_governance",
    "beidou_live",
    "beidou_cli",
]

[project]
name = "beidou"
version = "5.0.0a0"
description = "北斗 V5 — Alpha-First crypto perpetual-futures trading system (Binance USDⓈ-M, demo/testnet)"
readme = "README.md"
license = {text = "Proprietary"}
# Python 3.14 silently masked real failures in the past; keep the runtime pinned to 3.12/3.13.
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=14.0",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.92",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]
research = [
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]

[project.scripts]
beidou = "beidou_cli:main"

[tool.ruff]
target-version = "py312"
line-length = 120
force-exclude = true
# `.claude/skills` is vendored third-party MIT content, not our source.  Ruff formats python blocks
# inside markdown, and that reference file is a catalogue of deliberately WRONG code - reformatting the
# anti-patterns would edit an upstream project to no benefit and make the vendored copy diverge.
exclude = [".git", ".venv", "__pycache__", ".mypy_cache", ".pytest_cache", ".ruff_cache", "build", "dist", ".beidou", "reports", ".claude/skills"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "DTZ"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "DTZ"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Records, not source - the same reason `.claude/skills` is excluded above, applied to our own files.
# Ruff formats python blocks inside markdown, and every `.md` here quotes code as it was rather than as it
# should be: an execution plan's blocks are the text a task was handed verbatim, and a RESEARCH_LOG entry
# quotes the code a decision was made against.  `scratchpad/*.py` is committed for the same reason -
# `.gitignore` keeps those scripts because "they reproduce adoption decisions".  Reformatting either edits
# a record of what happened.  Excluded from the FORMATTER only, so `ruff check` still lints the scripts.
exclude = ["*.md", "scratchpad/*.py"]

[tool.mypy]
python_version = "3.12"
files = [
    "beidou_shared",
    "beidou_data",
    "beidou_alpha",
    "beidou_exchange",
    "beidou_governance",
    "beidou_live",
    "beidou_cli",
]
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = false
show_error_codes = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pyarrow.*", "scipy.*", "statsmodels.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = ["-q", "--strict-markers", "-p", "no:cacheprovider"]
markers = [
    "network: tests that reach the public internet (deselected by default in CI)",
    "slow: slow tests",
]
filterwarnings = ["error::DeprecationWarning:beidou_.*"]
