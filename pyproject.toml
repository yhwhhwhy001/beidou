"beidou_strategy/protection/adaptive.py" = ["RUF012"]
"delivery/scripts/collect_evidence.py" = ["S607", "S603"]
"tests/unit/test_control_gate.py" = ["RUF012"]
"tests/unit/test_launcher.py" = ["RUF012"]
"tests/unit/test_monitoring_services.py" = ["F405", "E702", "E701", "E501", "N817", "F403", "S105"]
"tools/e2e_real_demo.py" = ["E501"]
"tools/strategy_live_trade.py" = ["E501"]
"tests/**/*.py" = ["S311", "S108", "B017", "PGH003", "E741", "N801", "N818", "RUF043", "S105", "B008"]
"tests/architecture/test_architecture.py" = ["S112"]
"tests/unit/test_execution.py" = ["F811"]
"tests/unit/test_bf00_timing_mismatch.py" = ["S311", "SIM108"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
exclude = "(^|/)(beidou_state\\.db(?:-(?:shm|wal))?)$"
explicit_package_bases = true
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = false
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "architecture: Architecture enforcement tests",
    "performance: Performance benchmark tests",
    "security: Security tests",
    "chaos: Chaos engineering tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["beidou_shared", "beidou_safety", "beidou_strategy", "beidou_research", "beidou_policy", "beidou_security", "beidou_observability", "beidou_exchange", "beidou_lifecycle", "beidou_delivery", "beidou_autonomy", "beidou_infra", "beidou_data", "beidou_control", "beidou_chaos", "beidou_production", "beidou_reporting", "beidou_certification", "beidou_core", "beidou_launcher"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.critical_packages]
paths = [
    "beidou_safety/execution",
    "beidou_safety/risk",
    "beidou_safety/execution/ledger",
    "beidou_safety/execution/reconciliation",
    "beidou_exchange",
]
line_coverage = 95
branch_coverage = 90

[tool.black]
target-version = ["py312"]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

# === Mypy overrides: BD-T15 收紧豁免 ===
# P0 核心链 (beidou_safety.risk, beidou_safety.protection, beidou_exchange.core)
# 不再享有 ignore_errors — 错误已逐行修复或标注 type: ignore。
#
# 以下模块保留豁免，每个带 issue/owner/expiry：
# - beidou_core.engine: ~30+ 类型错误（4597 行遗留代码），BD-T05 重构中解决
# - beidou_safety/execution/*: no-untyped-def 遗留，BD-T08-T10 重构中解决
# - beidou_observability.monitoring.*: 无类型注解遗留代码
# - beidou_strategy/*: 少量遗留
# - beidou_data/*, beidou_lifecycle/*: no-untyped-def 遗留
[[tool.mypy.overrides]]
module = [
    "beidou_core.engine",                   # ~30+ errors / owner: core / expiry: 2026-11-30 (BD-T05 StrategyKernel)
    "beidou_core.health",                    # no-untyped-def / owner: core / expiry: 2026-09-30
    "beidou_core.store",                     # no-any-return / owner: core / expiry: 2026-09-30
    "beidou_core.feed",                      # no-untyped-def / owner: core / expiry: 2026-10-31
    "beidou_core.alerts",                    # dict-item / owner: core / expiry: 2026-09-30
    "beidou_safety.execution.*",            # no-untyped-def / owner: safety / expiry: 2026-11-30 (BD-T08-T10)
    "beidou_observability.monitoring.*",     # 无类型注解 / owner: infra / expiry: 2026-09-30
    "beidou_strategy.*",                     # 少量遗留 / owner: strategy / expiry: 2026-10-31 (BD-T05)
    "beidou_research.mining.*",             # pandas/numpy / owner: research / expiry: 2026-10-31
    "beidou_research.factors.*",            # pandas/numpy / owner: research / expiry: 2026-10-31
    "beidou_research.backtest.*",           # pandas/numpy / owner: research / expiry: 2026-10-31
    "beidou_shared.serde.*",                # msgpack 无 stub / owner: infra / expiry: 2026-09-30
    "beidou_exchange.binance_usdm.*",       # ws/rest client / owner: exchange / expiry: 2026-10-31
    "beidou_infra.*",                        # Connection/redis stub / owner: infra / expiry: 2026-10-31
    "beidou_control.api",                    # FastAPI 装饰器 (@app.get) 类型推断限制 / owner: infra / expiry: 2026-10-31
]
ignore_errors = true

# BD-T15: 已从豁免中移除的模块（类型错误已修复）：
# ✅ beidou_safety.risk.*, beidou_safety.protection.*, beidou_exchange.core.*
# ✅ beidou_launcher.* (含 cli), beidou_lifecycle.*, beidou_certification.*
# ✅ beidou_control.plane, beidou_data.*, beidou_production.*, beidou_exchange.router.*

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
