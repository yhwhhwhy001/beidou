[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "beidou_shared",
    "beidou_safety",
    "beidou_strategy",
    "beidou_research",
    "beidou_policy",
    "beidou_security",
    "beidou_observability",
    "beidou_exchange",
    "beidou_lifecycle",
    "beidou_delivery",
    "beidou_autonomy",
    "beidou_infra",
    "beidou_data",
    "beidou_control",
    "beidou_chaos",
    "beidou_production",
    "beidou_reporting",
    "beidou_certification",
    "beidou_core",
    "beidou_launcher",
]

[project]
name = "beidou"
version = "2.0.0"
description = "北斗 - 加密合约量化交易系统 (PIVOT 重构阶段)"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.12,<4.0"
dependencies = [
    "pydantic>=2.0",
    "msgpack>=1.0",
    "psycopg[binary]>=3.1",
    "structlog>=24.0",
    "prometheus-client>=0.19",
    "cryptography>=41.0",
    "pyjwt>=2.8",
    "httpx>=0.25",
    "tenacity>=8.2",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.scripts]
beidou = "beidou_launcher.cli:main"
"北斗" = "beidou_launcher.cli:main"
bd = "beidou_launcher.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "hypothesis>=6.92",
    "ruff>=0.3",
    "mypy>=1.8",
    "black>=24.0",
    "pre-commit>=3.6",
    "coverage>=7.4",
]
research = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "pyarrow>=14.0",
    "optuna>=3.3",
    "numba>=0.58",
]

[tool.ruff]
target-version = "py312"
line-length = 120
force-exclude = true
exclude = [".git", "__pycache__", ".mypy_cache", ".pytest_cache", "build", "dist", "beidou_state.db*", "beidou_monitor_state.json", "beidou_repair_log.jsonl"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "B", "S", "C4", "T20",
    "SIM", "RUF", "DTZ", "PGH",
]
ignore = ["S101", "S104", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"apps/**/*.py" = ["T201", "E501"]
"beidou_observability/monitoring/**/*.py" = ["E702", "E701", "T201", "E501", "SIM102", "F403", "E741"]
"beidou_observability/monitoring/__init__.py" = ["E702", "E701", "T201", "E501", "F401"]
