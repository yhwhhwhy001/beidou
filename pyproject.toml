[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "beidou_shared",
    "beidou_safety",
    "beidou_strategy",
    "beidou_research",
    "beidou_policy",
    "beidou_security",
    "beidou_observability",
    "beidou_exchange",
    "beidou_lifecycle",
    "beidou_delivery",
    "beidou_autonomy",
    "beidou_infra",
    "beidou_data",
    "beidou_control",
    "beidou_chaos",
    "beidou_production",
    "beidou_reporting",
    "beidou_certification",
    "beidou_core",
]


[project]
name = "beidou"
version = "2.0.0"
description = "北斗 - 加密合约量化交易系统 (PIVOT 重构阶段)"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.12,<4.0"
dependencies = [
    "pydantic>=2.0",
    "msgpack>=1.0",
    "psycopg[binary]>=3.1",
    "structlog>=24.0",
    "prometheus-client>=0.19",
    "cryptography>=41.0",
    "pyjwt>=2.8",
    "httpx>=0.25",
    "tenacity>=8.2",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "hypothesis>=6.92",
    "ruff>=0.3",
    "mypy>=1.8",
    "black>=24.0",
    "pre-commit>=3.6",
    "coverage>=7.4",
]
research = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "pyarrow>=14.0",
    "optuna>=3.3",
    "numba>=0.58",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".git", "__pycache__", ".mypy_cache", ".pytest_cache", "build", "dist", "beidou_state.db*", "beidou_monitor_state.json", "beidou_repair_log.jsonl"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "B", "S", "C4", "T20",
    "SIM", "RUF", "DTZ", "PGH",
]
ignore = ["S101", "S104", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"apps/**/*.py" = ["T201"]
"beidou_core/engine.py" = ["T201", "S310", "E501"]
"beidou_core/feed.py" = ["S310"]
"beidou_core/store.py" = ["E501"]
"beidou_core/alerts.py" = ["S108", "S110", "S310"]
"beidou_core/guard.py" = ["RUF012", "S607", "S105"]
"apps/autopilot/__main__.py" = ["S607"]
"beidou_safety/risk/rules.py" = ["RUF012", "S105"]
"beidou_exchange/binance_usdm/rest_client.py" = ["S310"]
"beidou_safety/risk/__init__.py" = ["E402", "F401"]
"beidou_strategy/portfolio/__init__.py" = ["E402", "F401"]
"beidou_safety/execution/__init__.py" = ["F401"]
"beidou_data/klines.py" = ["RUF012"]
"beidou_data/trading_pool_lifecycle.py" = ["SIM102"]
"beidou_safety/execution/algorithms.py" = ["RUF012"]
"beidou_safety/risk/approval.py" = ["E501"]
"beidou_safety/execution/intent.py" = ["E501", "F821"]
"beidou_security/identity.py" = ["RUF012", "N815"]
"beidou_certification/engine.py" = ["S105"]
"beidou_certification/evidence_bundle.py" = ["S105", "RUF012"]
"beidou_chaos/engine.py" = ["S105"]
"beidou_research/mining/**/*.py" = ["S311", "E501"]
"beidou_research/mining/generators/symbolic_gp.py" = ["S311", "S112"]
"beidou_research/mining/generators/residual.py" = ["S311", "B007"]
"beidou_research/mining/generators/regime_conditioned.py" = ["S311", "RUF034"]
"beidou_research/mining/point_in_time.py" = ["S311", "E501", "E741", "SIM102"]
"beidou_research/mining/runner.py" = ["S311", "E741"]
"beidou_research/mining/evaluation/purged_walk_forward.py" = ["S311", "E501", "SIM102"]
"beidou_research/mining/selection/redundancy.py" = ["S311", "N806", "N803"]
"beidou_infra/ha.py" = ["N801"]
"beidou_infra/outbox.py" = ["E501"]
"beidou_lifecycle/capability.py" = ["E501"]
"beidou_lifecycle/lifecycle.py" = ["E741"]
"beidou_exchange/core/error_taxonomy.py" = ["RUF012"]
"beidou_exchange/account_discovery/checker.py" = ["F402"]
"beidou_exchange/binance_usdm/adapter.py" = ["B008", "F821"]
"beidou_shared/types/__init__.py" = ["S105", "F401"]
"beidou_shared/contracts/__init__.py" = ["F401"]
"beidou_shared/envelope/__init__.py" = ["F401"]
"beidou_shared/serde/__init__.py" = ["F401"]
"beidou_strategy/alpha/contracts.py" = ["S105", "RUF009"]
"beidou_strategy/alpha/typed_graph.py" = ["SIM102"]
"beidou_strategy/portfolio/optimizer.py" = ["SIM102", "B007"]
"beidou_control/api.py" = ["F401"]
"beidou_policy/registry.py" = ["SIM102"]
"beidou_data/market.py" = ["E741"]
"tests/**/*.py" = ["S311", "S108", "B017", "PGH003", "E741", "N801", "N818", "RUF043", "S105", "B008"]
"tests/architecture/test_architecture.py" = ["S112"]
"tests/unit/test_execution.py" = ["F811"]
"tests/unit/test_bf00_timing_mismatch.py" = ["S311", "SIM108"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = false
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "architecture: Architecture enforcement tests",
    "performance: Performance benchmark tests",
    "security: Security tests",
    "chaos: Chaos engineering tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["beidou_shared", "beidou_safety", "beidou_strategy", "beidou_research", "beidou_policy", "beidou_security", "beidou_observability", "beidou_exchange", "beidou_lifecycle", "beidou_delivery", "beidou_autonomy", "beidou_infra", "beidou_data", "beidou_control", "beidou_chaos", "beidou_production", "beidou_reporting", "beidou_certification", "beidou_core"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# 关键包需要 >=95% 行覆盖
[tool.coverage.critical_packages]
paths = [
    "beidou_safety/execution",
    "beidou_safety/risk",
    "beidou_safety/execution/ledger",
    "beidou_safety/execution/reconciliation",
    "beidou_exchange",
]
line_coverage = 95
branch_coverage = 90

[tool.black]
target-version = ["py312"]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

# BD-T15: 核心交易链 mypy ignore_errors 已全部移除。
# 全量 mypy strict 类型检查通过 (0 errors)。
# 如需新增豁免，必须附带 issue/owner/expiry；P0 包禁止豁免。
# [[tool.mypy.overrides]] 块已删除 — 不再需要。
