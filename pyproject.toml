[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "beidou_shared",
    "beidou_data",
    "beidou_alpha",
    "beidou_exchange",
    "beidou_governance",
    "beidou_live",
    "beidou_cli",
]

[project]
name = "beidou"
version = "5.0.0a0"
description = "北斗 V5 — Alpha-First crypto perpetual-futures trading system (Binance USDⓈ-M, demo/testnet)"
readme = "README.md"
license = {text = "Proprietary"}
# Python 3.14 silently masked real failures in the past; keep the runtime pinned to 3.12/3.13.
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=14.0",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
# 这里的范围是给库使用者的；CI 与日常开发按 `requirements.lock` 的精确版本装。
# 两者的分工与时间边界写在 `requirements.lock` 的头注里——特别是：那个锚是**从 2026-09-13 起**的，
# 不是对 `reports/research/` 里既有报告所用版本的追溯声明。
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.92",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    # 覆盖率按需跑，**不进** `[tool.pytest.ini_options].addopts`：
    #   pytest -m "not network" --cov=beidou_alpha --cov=beidou_live --cov=beidou_data \
    #       --cov=beidou_exchange --cov-report=term-missing
    # 之所以只加依赖不加 addopts：addopts 会改变**每一个人**（本地、CI、并行进行中的其它工作）
    # 跑 `pytest` 时的行为——多一层 trace、慢一截、输出变形，而这个仓库的验收口径就是
    # `pytest -m "not network" -q` 那一行。覆盖率是诊断工具，不是门；把诊断工具接到默认路径上，
    # 等于让所有人替一次偶尔的诊断付账。要设阈值（`--cov-fail-under`）就更应该是显式的一次运行。
    "pytest-cov>=5.0",
]
research = [
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]

# TypeSafe System One（Jev）的客户端。**故意不进 `[project].dependencies`，也不进
# `requirements.lock`**：仓库里目前没有任何代码 import 它，而它的传递闭包是 8 个新包——
# httpx2 / httpcore2 / truststore，pydantic / pydantic-core / annotated-types /
# typing-inspection，tenacity。其中 httpx2 是与已钉的 `httpx==0.28.1` 并存的第二个
# HTTP 客户端。理由与 `research` extras 同一条，逐字见 `requirements.lock` 头注的
# 「不在这里的东西」：把 CI 不需要的包混进锁里，会让安装面无谓地扩大。
#
# 2026-09-20 用 `pip install --dry-run -r requirements.lock "typesafe-sdk>=0.7"` 验过：
# 锁里每一个版本都原样存活（httpx 0.28.1、numpy 2.5.2、pandas 3.0.5、mypy 2.3.1 都没被顶）。
# 所以拦在锁外面的理由是安装面，不是冲突——这两件事将来会被混为一谈，先写清楚。
#
# 等到有代码真的 import 它，再决定升为运行时依赖并重跑闭包、还是单开一份 lock——
# 那时 numpy/pandas 那一节「决定回测与实盘数值」的说法要不要对它成立，是一个要单独想的问题。
typesafe = [
    "typesafe-sdk>=0.7",
]

[project.scripts]
beidou = "beidou_cli:main"

[tool.ruff]
target-version = "py312"
line-length = 120
force-exclude = true
# `.claude/skills` is vendored third-party MIT content, not our source.  Ruff formats python blocks
# inside markdown, and that reference file is a catalogue of deliberately WRONG code - reformatting the
# anti-patterns would edit an upstream project to no benefit and make the vendored copy diverge.
exclude = [".git", ".venv", "__pycache__", ".mypy_cache", ".pytest_cache", ".ruff_cache", "build", "dist", ".beidou", "reports", ".claude/skills"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "DTZ"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "DTZ"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Records, not source - the same reason `.claude/skills` is excluded above, applied to our own files.
# Ruff formats python blocks inside markdown, and every `.md` here quotes code as it was rather than as it
# should be: an execution plan's blocks are the text a task was handed verbatim, and a RESEARCH_LOG entry
# quotes the code a decision was made against.  `scratchpad/*.py` is committed for the same reason -
# `.gitignore` keeps those scripts because "they reproduce adoption decisions".  Reformatting either edits
# a record of what happened.  Excluded from the FORMATTER only, so `ruff check` still lints the scripts.
exclude = ["*.md", "scratchpad/*.py"]

[tool.mypy]
python_version = "3.12"
files = [
    "beidou_shared",
    "beidou_data",
    "beidou_alpha",
    "beidou_exchange",
    "beidou_governance",
    "beidou_live",
    "beidou_cli",
]
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = false
show_error_codes = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pyarrow.*", "scipy.*", "statsmodels.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = ["-q", "--strict-markers", "-p", "no:cacheprovider"]
markers = [
    "network: tests that reach the public internet (deselected by default in CI)",
    "slow: slow tests",
]
filterwarnings = ["error::DeprecationWarning:beidou_.*"]
